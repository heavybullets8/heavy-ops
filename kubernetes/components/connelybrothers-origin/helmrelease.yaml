---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app connelybrothers-origin
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      connelybrothers-origin:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image: &image
              repository: docker.io/library/caddy
              tag: 2.11.6@sha256:907efba736324e43f891ccb9d760fe5abe545e313419b3d18d63d4ec670dad8d
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -ec
            args:
              - test $${#HA_ORIGIN_TOKEN} -ge 32; test $${#HA_MONITOR_TOKEN} -ge 32; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
            env:
              XDG_DATA_HOME: /data
              XDG_CONFIG_HOME: /data/config
            envFrom:
              - secretRef:
                  name: connelybrothers-origin-secret
            securityContext:
              runAsUser: 10001
              runAsGroup: 10001
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 18091
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        type: configMap
        name: connelybrothers-origin-config
        globalMounts:
          - path: /etc/caddy
            readOnly: true
      data:
        type: emptyDir
        sizeLimit: 256Mi
        globalMounts:
          - path: /data

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app connelybrothers-origin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *app
    template:
      data:
        HA_ORIGIN_TOKEN: "{{ .CONNELYBROTHERS_ORIGIN_TOKEN }}"
        HA_MONITOR_TOKEN: "{{ .CONNELYBROTHERS_MONITOR_TOKEN }}"
  dataFrom:
    - extract:
        key: connelybrothers
      rewrite:
        - regexp:
            source: "(.*)"
            target: "CONNELYBROTHERS_$1"

apiVersion: v1
kind: Service
metadata:
  name: ha-cloud-ssh
  namespace: business-ha-production
  labels:
    app.kubernetes.io/part-of: business-ha
spec:
  type: ClusterIP
  externalIPs:
  - 209.50.58.65
  publishNotReadyAddresses: true
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: ha-cloud
  ports:
  - name: ssh
    protocol: TCP
    port: 22
    targetPort: 2222
---
apiVersion: v1
kind: Service
metadata:
  name: ha-cloud
  namespace: business-ha-production
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: ha-cloud
    app.kubernetes.io/part-of: business-ha
  ports:
  - name: app
    port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ha-cloud-https
  namespace: business-ha-production
  labels:
    app.kubernetes.io/part-of: business-ha
spec:
  type: ClusterIP
  externalIPs:
  - 209.50.58.65
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: ha-cloud
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8443

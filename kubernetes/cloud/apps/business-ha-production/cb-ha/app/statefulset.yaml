apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ha-cloud
  namespace: business-ha-production
  labels:
    app.kubernetes.io/name: ha-cloud
    app.kubernetes.io/part-of: business-ha
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  serviceName: ha-cloud
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-cloud
      app.kubernetes.io/part-of: business-ha
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-cloud
        app.kubernetes.io/part-of: business-ha
    spec:
      nodeSelector:
        kubernetes.io/hostname: trial-talos
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      initContainers:
      - name: prepare-volumes
        image: ${CB_HA_DB_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - mkdir -p /ha-data/postgres /ha-data/etcd; chown 999:999 /ha-data /ha-data/postgres /ha-data/etcd /ha-forensics /var/run/postgresql;
          chmod 0700 /ha-forensics; chmod 0770 /var/run/postgresql
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /ha-data
        - name: forensic
          mountPath: /ha-forensics
        - name: postgres-socket
          mountPath: /var/run/postgresql
      - name: cb-caddy-data-permissions
        image: ${CB_HA_PROXY_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - mkdir -p /ha-forensics/caddy-cloud; chown 10001:10001 /ha-forensics/caddy-cloud; chmod 0700 /ha-forensics/caddy-cloud
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: forensic
          mountPath: /ha-forensics
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: etcd
        image: ${CB_HA_ETCD_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/etcd
        args:
        - --name=cloud
        - --data-dir=/ha-data/etcd
        - --listen-client-urls=http://127.0.0.1:32379
        - --advertise-client-urls=http://127.0.0.1:32379
        - --listen-peer-urls=http://127.0.0.1:32380
        - --initial-advertise-peer-urls=http://127.0.0.1:32380
        - --initial-cluster=home=http://127.0.0.1:22380,cloud=http://127.0.0.1:32380,voter=http://127.0.0.1:12380
        - --initial-cluster-token=business-ha-production-20261003
        - --initial-cluster-state=new
        - --heartbeat-interval=250
        - --election-timeout=2500
        - --log-level=warn
        volumeMounts:
        - name: data
          mountPath: /ha-data
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      - name: db
        image: ${CB_HA_DB_IMAGE}
        imagePullPolicy: IfNotPresent
        env:
        - name: PATRONI_NAME
          value: cloud
        - name: HA_REWIND_PGDATA
          value: /ha-data/postgres
        - name: HA_REWIND_QUARANTINE
          value: /ha-forensics
        - name: PATRONI_POSTGRESQL_AUTHENTICATION_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ha-db-auth
              key: superuser_password
        - name: PATRONI_POSTGRESQL_AUTHENTICATION_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ha-db-auth
              key: replication_password
        - name: PATRONI_POSTGRESQL_AUTHENTICATION_REWIND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ha-db-auth
              key: rewind_password
        - name: PATRONI_RESTAPI_USERNAME
          valueFrom:
            secretKeyRef:
              name: ha-db-auth
              key: rest_username
        - name: PATRONI_RESTAPI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ha-db-auth
              key: rest_password
        volumeMounts:
        - name: data
          mountPath: /ha-data
        - name: forensic
          mountPath: /ha-forensics
        - name: postgres-socket
          mountPath: /var/run/postgresql
        - name: site-config
          mountPath: /etc/patroni.yml
          subPath: patroni.yml
          readOnly: true
        - name: runtime-scripts
          mountPath: /opt/ha/pg_rewind
          subPath: pg_rewind
          readOnly: true
        - name: backrest
          mountPath: /etc/pgbackrest/pgbackrest.conf
          subPath: pgbackrest.conf
          readOnly: true
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - /opt/patroni/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status ==
              200
          periodSeconds: 3
          failureThreshold: 60
          timeoutSeconds: 1
        livenessProbe:
          exec:
            command:
            - /opt/patroni/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status ==
              200
          periodSeconds: 3
          failureThreshold: 3
          timeoutSeconds: 1
        readinessProbe:
          exec:
            command:
            - /opt/patroni/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status ==
              200
          periodSeconds: 3
          failureThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
      - name: pgbackrest-scheduler
        image: ${CB_HA_DB_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /opt/patroni/bin/python
        - /opt/ha/backup_scheduler.py
        args:
        - --site
        - cloud
        - --stanza
        - ${CB_PROD_BACKUP_STANZA}
        - --state-dir
        - /ha-forensics/backup-scheduler
        - --primary-url
        - http://127.0.0.1:8008/primary
        - --metrics-port
        - '9187'
        volumeMounts:
        - name: data
          mountPath: /ha-data
        - name: forensic
          mountPath: /ha-forensics
        - name: postgres-socket
          mountPath: /var/run/postgresql
        - name: runtime-scripts
          mountPath: /opt/ha/backup_scheduler.py
          subPath: backup_scheduler.py
          readOnly: true
        - name: backrest
          mountPath: /etc/pgbackrest/pgbackrest.conf
          subPath: pgbackrest.conf
          readOnly: true
        ports:
        - name: backup-metrics
          containerPort: 9187
        livenessProbe:
          httpGet:
            path: /healthz
            port: backup-metrics
          periodSeconds: 15
          failureThreshold: 3
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
      - name: wal-metrics
        image: ${CB_HA_DB_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /opt/patroni/bin/python
        - /opt/ha/wal_metrics.py
        volumeMounts:
        - name: postgres-socket
          mountPath: /var/run/postgresql
        - name: runtime-scripts
          mountPath: /opt/ha/wal_metrics.py
          subPath: wal_metrics.py
          readOnly: true
        ports:
        - name: wal-metrics
          containerPort: 9188
        readinessProbe:
          exec:
            command:
            - /opt/patroni/bin/python
            - -c
            - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:9188/healthz',timeout=1).status==200
          periodSeconds: 5
          timeoutSeconds: 2
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      - name: ssh-voter
        image: ${CB_HA_SSH_IMAGE}
        imagePullPolicy: IfNotPresent
        args:
        - client
        - -L127.0.0.1:12379:127.0.0.1:12379
        - -L127.0.0.1:12380:127.0.0.1:12380
        - -R127.0.0.1:32379:127.0.0.1:32379
        - -R127.0.0.1:32380:127.0.0.1:32380
        - -R127.0.0.1:25433:127.0.0.1:5432
        - -R127.0.0.1:28009:127.0.0.1:8008
        - ha-prod-tunnel@172.31.88.2
        volumeMounts:
        - name: ssh-client-identity
          mountPath: /etc/ha-ssh
          readOnly: true
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      - name: ssh-server
        image: ${CB_HA_SSH_IMAGE}
        imagePullPolicy: IfNotPresent
        args:
        - server
        ports:
        - name: ha-ssh
          containerPort: 2222
          protocol: TCP
        volumeMounts:
        - name: ssh-server-identity
          mountPath: /etc/ha-ssh
          readOnly: true
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - SETUID
            - SETGID
            - CHOWN
            - SYS_CHROOT
            - DAC_OVERRIDE
            - FOWNER
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      - name: cb-app
        image: ${CB_HA_APP_IMAGE}
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: '8000'
        - name: HA_RUNTIME
          value: '1'
        - name: HA_PROFILE
          value: production
        - name: HA_SITE
          value: cloud
        - name: HA_PATRONI_URL
          value: http://127.0.0.1:8008
        - name: HA_CRON_ENABLED
          value: 'false'
        - name: DENO_ENV
          value: production
        - name: SITE_URL
          value: https://${CB_PUBLIC_HOST}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: DATABASE_URL
        - name: HA_OUTBOX_PEER_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: HA_OUTBOX_PEER_DATABASE_URL
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: ADMIN_PASSWORD_HASH
        - name: R2_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: R2_ACCOUNT_ID
        - name: R2_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: R2_ACCESS_KEY_ID
        - name: R2_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: R2_SECRET_ACCESS_KEY
        - name: R2_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: R2_BUCKET_NAME
        - name: R2_PUBLIC_URL
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: R2_PUBLIC_URL
        - name: GOOGLE_MAPS_PUBLIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: GOOGLE_MAPS_PUBLIC_API_KEY
        - name: GOOGLE_MAPS_ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: GOOGLE_MAPS_ADMIN_API_KEY
        - name: TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: TURNSTILE_SITE_KEY
        - name: TURNSTILE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: TURNSTILE_SECRET_KEY
        - name: CLOUDFLARE_CACHE_PURGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: CLOUDFLARE_CACHE_PURGE_TOKEN
        - name: CLOUDFLARE_ZONE_IDS
          valueFrom:
            secretKeyRef:
              name: cb-app
              key: CLOUDFLARE_ZONE_IDS
        ports:
        - name: cb-http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /healthz
            port: cb-http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: cb-http
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: cb-http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: cb-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 3Gi
      - name: cb-origin-proxy
        image: ${CB_HA_PROXY_IMAGE}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - test $${#HA_ORIGIN_TOKEN} -ge 32; test $${#HA_MONITOR_TOKEN} -ge 32; exec caddy run --config /etc/caddy/Caddyfile
          --adapter caddyfile
        env:
        - name: HA_ORIGIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: cb-origin
              key: ORIGIN_TOKEN
        - name: HA_MONITOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: ha-monitor
              key: token
        - name: XDG_DATA_HOME
          value: /data
        - name: XDG_CONFIG_HOME
          value: /data/config
        volumeMounts:
        - name: cb-origin-config
          mountPath: /etc/caddy
          readOnly: true
        - name: forensic
          mountPath: /data
          subPath: caddy-cloud
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        ports:
        - name: origin-http
          containerPort: 8080
        - name: origin-https
          containerPort: 8443
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: patroni-data
      - name: forensic
        persistentVolumeClaim:
          claimName: patroni-pre-rewind
      - name: postgres-socket
        emptyDir:
          sizeLimit: 16Mi
      - name: site-config
        configMap:
          name: ha-site-config
          defaultMode: 365
      - name: backrest
        secret:
          secretName: ha-pgbackrest
          defaultMode: 292
      - name: ssh-client-identity
        secret:
          secretName: ha-ssh
          defaultMode: 256
          items:
          - key: id_ed25519
            path: id_ed25519
          - key: known_hosts
            path: known_hosts
      - name: ssh-server-identity
        secret:
          secretName: ha-ssh
          defaultMode: 256
          items:
          - key: host_ed25519_key
            path: host_ed25519_key
          - key: authorized_keys
            path: authorized_keys
      - name: cb-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: cb-origin-config
        configMap:
          name: cb-ha-origin-proxy
      - name: runtime-scripts
        configMap:
          name: ha-runtime-scripts
          defaultMode: 365
      imagePullSecrets:
      - name: business-ghcr

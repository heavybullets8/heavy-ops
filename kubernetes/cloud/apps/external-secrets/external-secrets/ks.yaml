apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  targetNamespace: external-secrets
  path: ./kubernetes/cloud/apps/external-secrets/external-secrets/app
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

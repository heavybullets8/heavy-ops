apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: kube-system
spec:
  targetNamespace: kube-system
  path: ./kubernetes/cloud/apps/kube-system/reloader/app
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  suspend: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patroni-ssh-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: patroni-ssh-secret
    template:
      data:
        id_ed25519: "{{ .PATRONI_CLOUD_SSH_PRIVATE_KEY }}"
        known_hosts: "{{ .PATRONI_CLOUD_KNOWN_HOSTS }}"
        host_ed25519_key: "{{ .PATRONI_CLOUD_SSH_HOST_PRIVATE_KEY }}"
        authorized_keys: "{{ .PATRONI_CLOUD_AUTHORIZED_KEYS }}"
  dataFrom:
    - extract:
        key: patroni
      rewrite:
        - regexp:
            source: "(.*)"
            target: "PATRONI_$1"

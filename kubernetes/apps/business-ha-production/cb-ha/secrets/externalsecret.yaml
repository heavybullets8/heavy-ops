apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cb-app
  namespace: business-ha-production
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cb-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        DATABASE_URL: '{{ $value := (.application | fromJson).DATABASE_URL }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required DATABASE_URL" }}{{ end }}{{ $value }}'
        ADMIN_USERNAME: '{{ $value := (.application | fromJson).ADMIN_USERNAME }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required ADMIN_USERNAME" }}{{ end }}{{ $value }}'
        ADMIN_PASSWORD_HASH: '{{ $value := (.application | fromJson).ADMIN_PASSWORD_HASH }}{{ if or (not (kindIs "string"
          $value)) (not $value) }}{{ fail "Missing required ADMIN_PASSWORD_HASH" }}{{ end }}{{ $value }}'
        R2_ACCOUNT_ID: '{{ $value := (.application | fromJson).R2_ACCOUNT_ID }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required R2_ACCOUNT_ID" }}{{ end }}{{ $value }}'
        R2_ACCESS_KEY_ID: '{{ $value := (.application | fromJson).R2_ACCESS_KEY_ID }}{{ if or (not (kindIs "string" $value))
          (not $value) }}{{ fail "Missing required R2_ACCESS_KEY_ID" }}{{ end }}{{ $value }}'
        R2_SECRET_ACCESS_KEY: '{{ $value := (.application | fromJson).R2_SECRET_ACCESS_KEY }}{{ if or (not (kindIs "string"
          $value)) (not $value) }}{{ fail "Missing required R2_SECRET_ACCESS_KEY" }}{{ end }}{{ $value }}'
        R2_BUCKET_NAME: '{{ $value := (.application | fromJson).R2_BUCKET_NAME }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required R2_BUCKET_NAME" }}{{ end }}{{ $value }}'
        R2_PUBLIC_URL: '{{ $value := (.application | fromJson).R2_PUBLIC_URL }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required R2_PUBLIC_URL" }}{{ end }}{{ $value }}'
        GOOGLE_MAPS_PUBLIC_API_KEY: '{{ $value := (.application | fromJson).GOOGLE_MAPS_PUBLIC_API_KEY }}{{ if or (not (kindIs
          "string" $value)) (not $value) }}{{ fail "Missing required GOOGLE_MAPS_PUBLIC_API_KEY" }}{{ end }}{{ $value }}'
        GOOGLE_MAPS_ADMIN_API_KEY: '{{ $value := (.application | fromJson).GOOGLE_MAPS_ADMIN_API_KEY }}{{ if or (not (kindIs
          "string" $value)) (not $value) }}{{ fail "Missing required GOOGLE_MAPS_ADMIN_API_KEY" }}{{ end }}{{ $value }}'
        TURNSTILE_SITE_KEY: '{{ $value := (.application | fromJson).TURNSTILE_SITE_KEY }}{{ if or (not (kindIs "string" $value))
          (not $value) }}{{ fail "Missing required TURNSTILE_SITE_KEY" }}{{ end }}{{ $value }}'
        TURNSTILE_SECRET_KEY: '{{ $value := (.application | fromJson).TURNSTILE_SECRET_KEY }}{{ if or (not (kindIs "string"
          $value)) (not $value) }}{{ fail "Missing required TURNSTILE_SECRET_KEY" }}{{ end }}{{ $value }}'
        CLOUDFLARE_CACHE_PURGE_TOKEN: '{{ $value := (.application | fromJson).CLOUDFLARE_CACHE_PURGE_TOKEN }}{{ if or (not
          (kindIs "string" $value)) (not $value) }}{{ fail "Missing required CLOUDFLARE_CACHE_PURGE_TOKEN" }}{{ end }}{{ $value
          }}'
        CLOUDFLARE_ZONE_IDS: '{{ $value := (.application | fromJson).CLOUDFLARE_ZONE_IDS }}{{ if or (not (kindIs "string"
          $value)) (not $value) }}{{ fail "Missing required CLOUDFLARE_ZONE_IDS" }}{{ end }}{{ $value }}'
        HA_OUTBOX_PEER_DATABASE_URL: '{{ $value := (.application | fromJson).HA_OUTBOX_PEER_DATABASE_URL_HOME }}{{ if or (not
          (kindIs "string" $value)) (not $value) }}{{ fail "Missing required HA_OUTBOX_PEER_DATABASE_URL_HOME" }}{{ end }}{{
          $value }}'
  data:
  - secretKey: application
    remoteRef:
      key: cb-production-env
      property: password
---

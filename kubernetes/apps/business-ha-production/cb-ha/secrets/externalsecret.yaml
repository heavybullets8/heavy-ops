apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-db-auth
  namespace: business-ha-production
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ha-db-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        superuser_password: '{{ $value := (.runtime | fromJson).SUPERUSER_PASSWORD }}{{ if or (not (kindIs "string" $value))
          (not $value) }}{{ fail "Missing required SUPERUSER_PASSWORD" }}{{ end }}{{ $value }}'
        replication_password: '{{ $value := (.runtime | fromJson).REPLICATION_PASSWORD }}{{ if or (not (kindIs "string" $value))
          (not $value) }}{{ fail "Missing required REPLICATION_PASSWORD" }}{{ end }}{{ $value }}'
        rewind_password: '{{ $value := (.runtime | fromJson).REWIND_PASSWORD }}{{ if or (not (kindIs "string" $value)) (not
          $value) }}{{ fail "Missing required REWIND_PASSWORD" }}{{ end }}{{ $value }}'
        rest_username: '{{ $value := (.runtime | fromJson).REST_USERNAME }}{{ if or (not (kindIs "string" $value)) (not $value)
          }}{{ fail "Missing required REST_USERNAME" }}{{ end }}{{ $value }}'
        rest_password: '{{ $value := (.runtime | fromJson).REST_PASSWORD }}{{ if or (not (kindIs "string" $value)) (not $value)
          }}{{ fail "Missing required REST_PASSWORD" }}{{ end }}{{ $value }}'
  data:
  - secretKey: runtime
    remoteRef:
      key: cb-ha-runtime
      property: password
---

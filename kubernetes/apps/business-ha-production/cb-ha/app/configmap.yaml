apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-site-config
  namespace: business-ha-production
data:
  patroni.yml: |
    {
      "scope": "business-ha-production",
      "namespace": "/business-ha/production/",
      "restapi": {
        "listen": "127.0.0.1:8008",
        "connect_address": "127.0.0.1:28008"
      },
      "etcd3": {
        "hosts": "127.0.0.1:22379,127.0.0.1:32379,127.0.0.1:12379"
      },
      "bootstrap": {
        "dcs": {
          "ttl": 30,
          "loop_wait": 3,
          "retry_timeout": 5,
          "primary_start_timeout": 0,
          "maximum_lag_on_failover": 1048576,
          "check_timeline": true,
          "synchronous_mode": false,
          "synchronous_mode_strict": false,
          "failsafe_mode": false,
          "postgresql": {
            "use_slots": true,
            "use_pg_rewind": true,
            "remove_data_directory_on_rewind_failure": false,
            "remove_data_directory_on_diverged_timelines": false,
            "parameters": {
              "synchronous_commit": "on",
              "fsync": "on",
              "full_page_writes": "on",
              "wal_log_hints": "on",
              "unix_socket_directories": "/var/run/postgresql",
              "max_connections": 100,
              "shared_buffers": "64MB",
              "archive_mode": "on",
              "archive_timeout": "30s",
              "wal_keep_size": "128MB",
              "max_slot_wal_keep_size": "512MB",
              "archive_command": "pgbackrest --stanza=${CB_PROD_BACKUP_STANZA} archive-push %p"
            }
          }
        },
        "initdb": [
          {
            "encoding": "UTF8"
          },
          "data-checksums"
        ],
        "pg_hba": [
          "local all postgres peer",
          "host all all 127.0.0.1/32 scram-sha-256",
          "host replication replicator 127.0.0.1/32 scram-sha-256"
        ]
      },
      "postgresql": {
        "listen": "127.0.0.1:5432",
        "connect_address": "127.0.0.1:25432",
        "data_dir": "/ha-data/postgres",
        "bin_name": {
          "pg_rewind": "/opt/ha/pg_rewind"
        },
        "recovery_conf": {
          "restore_command": "pgbackrest --stanza=${CB_PROD_BACKUP_STANZA} archive-get %f %p"
        },
        "authentication": {
          "superuser": {
            "username": "postgres"
          },
          "replication": {
            "username": "replicator"
          },
          "rewind": {
            "username": "rewind_user"
          }
        }
      },
      "watchdog": {
        "mode": "off"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cb-ha-origin-proxy
  namespace: business-ha-production
data:
  Caddyfile: |
    {
        http_port 8080
        https_port 8443
    }

    (_ha_protected) {
        @backupMetrics {
            path /_ha/backup-metrics
            header Authorization "Bearer {$HA_MONITOR_TOKEN}"
        }
        handle @backupMetrics {
            rewrite * /metrics
            reverse_proxy 127.0.0.1:9187 {
                header_up -Authorization
            }
        }

        @walMetrics {
            path /_ha/wal-metrics
            header Authorization "Bearer {$HA_MONITOR_TOKEN}"
        }
        handle @walMetrics {
            rewrite * /metrics
            reverse_proxy 127.0.0.1:9188 {
                header_up -Authorization
            }
        }

        @patroni {
            path /_ha/patroni
            header Authorization "Bearer {$HA_MONITOR_TOKEN}"
        }
        handle @patroni {
            rewrite * /
            reverse_proxy 127.0.0.1:8008 {
                header_up -Authorization
            }
        }

        @primary {
            path /_ha/primary
            header Authorization "Bearer {$HA_MONITOR_TOKEN}"
        }
        handle @primary {
            rewrite * /primary
            reverse_proxy 127.0.0.1:8008 {
                header_up -Authorization
            }
        }

        @cluster {
            path /_ha/cluster
            header Authorization "Bearer {$HA_MONITOR_TOKEN}"
        }
        handle @cluster {
            rewrite * /cluster
            reverse_proxy 127.0.0.1:8008 {
                header_up -Authorization
            }
        }

        @monitorPath path /_ha/backup-metrics /_ha/wal-metrics /_ha/patroni /_ha/primary /_ha/cluster
        handle @monitorPath {
            respond 404
        }

        @appForwarded {
            header X-HA-Origin-Token {$HA_ORIGIN_TOKEN}
            header X-Forwarded-Host *
        }
        handle @appForwarded {
            reverse_proxy 127.0.0.1:8000 {
                header_up Host {http.request.header.X-Forwarded-Host}
                header_up X-Forwarded-Proto https
                header_up -X-HA-Origin-Token
            }
        }

        @app header X-HA-Origin-Token {$HA_ORIGIN_TOKEN}
        handle @app {
            reverse_proxy 127.0.0.1:8000 {
                header_up X-Forwarded-Proto https
                header_up -X-HA-Origin-Token
            }
        }

        handle {
            respond 404
        }
    }

    :18091 {
        import _ha_protected
    }

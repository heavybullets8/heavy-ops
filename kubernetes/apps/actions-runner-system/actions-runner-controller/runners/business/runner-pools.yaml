apiVersion: v1
kind: List
items:
  - &runnerPool
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: deno-kit-runner
    spec: &runnerPoolSpec
      suspend: false
      driftDetection:
        mode: enabled
      interval: 30m
      chartRef:
        kind: OCIRepository
        name: gha-runner-scale-set
      dependsOn:
        - name: actions-runner-controller
          namespace: actions-runner-system
      valuesFrom:
        - targetPath: githubConfigSecret.github_app_id
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_APP_ID
        - targetPath: githubConfigSecret.github_app_installation_id
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_INSTALLATION_ID
        - targetPath: githubConfigSecret.github_app_private_key
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_PRIVATE_KEY
      values: &runnerPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/deno-kit
        runnerScaleSetName: deno-kit-runner
        minRunners: 0
        maxRunners: 3
        controllerServiceAccount:
          name: actions-runner-controller
          namespace: actions-runner-system
        template:
          spec: &runnerPodSpec
            automountServiceAccountToken: false
            initContainers:
              - &runnerExternals
                name: init-dind-externals
                image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
                command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
                volumeMounts:
                  - name: dind-externals
                    mountPath: /home/runner/tmpDir
              - &runnerDind
                name: dind
                image: docker:28-dind@sha256:9a06753d2401cd049b34cd27dbbc3e0db717d4c1db7bc7f2efad1c187e00bf5a
                args:
                  - dockerd
                  - --host=unix:///var/run/docker.sock
                  - --group=$(DOCKER_GROUP_GID)
                env:
                  - name: DOCKER_GROUP_GID
                    value: "123"
                securityContext:
                  privileged: true
                restartPolicy: Always
                startupProbe:
                  exec:
                    command: ["docker", "info"]
                  failureThreshold: 24
                  periodSeconds: 5
                resources:
                  requests:
                    cpu: 500m
                    memory: 2Gi
                    ephemeral-storage: 5Gi
                  limits:
                    cpu: 4
                    memory: 6Gi
                    ephemeral-storage: 40Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
                  - name: dind-externals
                    mountPath: /home/runner/externals
            containers:
              - &runnerContainer
                name: runner
                image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOCKER_HOST
                    value: unix:///var/run/docker.sock
                  - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                    value: "120"
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 2Gi
                  limits:
                    cpu: 4
                    memory: 4Gi
                    ephemeral-storage: 10Gi
                volumeMounts:
                  - name: work
                    mountPath: /home/runner/_work
                  - name: dind-sock
                    mountPath: /var/run
            volumes:
              - name: work
                emptyDir:
                  sizeLimit: 20Gi
              - name: dind-sock
                emptyDir: {}
              - name: dind-externals
                emptyDir: {}
  - <<: *runnerPool
    metadata:
      name: nix-config-runner
    spec:
      <<: *runnerPoolSpec
      suspend: false
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/nix-config
        runnerScaleSetName: nix-config-runner
  - <<: *runnerPool
    metadata:
      name: fcc-spam-reporter-runner
    spec:
      <<: *runnerPoolSpec
      suspend: false
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/fcc-spam-reporter
        runnerScaleSetName: fcc-spam-reporter-runner
  - <<: *runnerPool
    metadata:
      name: scale-tv-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/scale-tv
        runnerScaleSetName: scale-tv-runner
  - <<: *runnerPool
    metadata:
      name: mk-jm-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 3
        githubConfigUrl: https://github.com/Heavybullets8/mk-jm
        runnerScaleSetName: mk-jm-runner
  - <<: *runnerPool
    metadata:
      name: mk-rentals-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/mk_rentals
        runnerScaleSetName: mk-rentals-runner
  - <<: *runnerPool
    metadata:
      name: connelybrothers-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/connelybrothers
        runnerScaleSetName: connelybrothers-runner
  - <<: *runnerPool
    metadata:
      name: connelyslandscaping-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/connelyslandscaping
        runnerScaleSetName: connelyslandscaping-runner
  - <<: *runnerPool
    metadata:
      name: cloudpeakinsulation-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/cloudpeakinsulation
        runnerScaleSetName: cloudpeakinsulation-runner
  - <<: *runnerPool
    metadata:
      name: anytimesteel-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/anytimesteel
        runnerScaleSetName: anytimesteel-runner
  - <<: *runnerPool
    metadata:
      name: bighorn-byte-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/bighorn-byte
        runnerScaleSetName: bighorn-byte-runner
        minRunners: 2
        template:
          spec:
            <<: *runnerPodSpec
            initContainers:
              - <<: *runnerExternals
                image: ghcr.io/heavybullets8/business-runner:2.337.0@sha256:393d1e7981b421f40dd976e5f150ebf8438d513191ba8e998d8a637bf6670387
              - *runnerDind
            containers:
              - <<: *runnerContainer
                image: ghcr.io/heavybullets8/business-runner:2.337.0@sha256:393d1e7981b421f40dd976e5f150ebf8438d513191ba8e998d8a637bf6670387
  - <<: *runnerPool
    metadata:
      name: site-fallback-worker-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/site-fallback-worker
        runnerScaleSetName: site-fallback-worker-runner
  - <<: *runnerPool
    metadata:
      name: email-guard-worker-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/email-guard-worker
        runnerScaleSetName: email-guard-worker-runner
  - <<: *runnerPool
    metadata:
      name: b7-leather-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/b7-leather
        runnerScaleSetName: b7-leather-runner
  - <<: *runnerPool
    metadata:
      name: image-resize-worker-runner
    spec:
      <<: *runnerPoolSpec
      values:
        <<: *runnerPoolValues
        maxRunners: 1
        githubConfigUrl: https://github.com/Heavybullets8/image-resize-worker
        runnerScaleSetName: image-resize-worker-runner

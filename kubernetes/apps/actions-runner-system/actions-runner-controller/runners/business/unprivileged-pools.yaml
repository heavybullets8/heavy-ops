                startupProbe:
                  exec:
                    command: [pg_isready, -h, "127.0.0.1", -p, "5434", -U, cloudpeak, -d, cloudpeak]
                  periodSeconds: 2
                  failureThreshold: 30
  - <<: *ciPool
    metadata:
      name: connelybrothers-ci
    spec:

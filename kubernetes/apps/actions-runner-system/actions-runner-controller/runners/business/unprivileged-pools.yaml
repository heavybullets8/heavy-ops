  - <<: *ciPool
    metadata:
      name: mk-jm-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/mk-jm
        runnerScaleSetName: mk-jm-ci
        maxRunners: 3
        template:
          spec:
            <<: *databasePod
            containers:
              - <<: *databaseRunner
                image: ghcr.io/heavybullets8/business-runner:2.337.0@sha256:edf8251a4ca356b80c2dae07f4a2d8974b5e33624e11547972145728003fdc14
            initContainers:
              - <<: *postgresSidecar
                args: ["-p", "5432", "-c", "listen_addresses=127.0.0.1"]
                env:
                  - name: POSTGRES_USER
                    value: dev
                  - name: POSTGRES_PASSWORD
                    value: devpassword
                  - name: POSTGRES_DB
                    value: mk_sales_dev
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                startupProbe:

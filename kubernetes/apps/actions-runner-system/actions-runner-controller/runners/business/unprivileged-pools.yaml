                  - name: POSTGRES_PASSWORD
                    value: devpassword
                  - name: POSTGRES_DB
                    value: connelybros
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                startupProbe:
                  exec:
                    command: [pg_isready, -h, "127.0.0.1", -p, "5436", -U, connelybros, -d, connelybros]
                  periodSeconds: 2
                  failureThreshold: 30
  - <<: *ciPool
    metadata:
      name: connelyslandscaping-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/connelyslandscaping
        runnerScaleSetName: connelyslandscaping-ci
        maxRunners: 1
        template:
          spec:
            <<: *databasePod
            initContainers:
              - <<: *postgresSidecar
                args: ["-p", "5437", "-c", "listen_addresses=127.0.0.1"]
                env:
                  - name: POSTGRES_USER
                    value: dev
                  - name: POSTGRES_PASSWORD
                    value: devpassword
                  - name: POSTGRES_DB
                    value: connelyslandscaping_dev
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                startupProbe:
                  exec:
                    command: [pg_isready, -h, "127.0.0.1", -p, "5437", -U, dev, -d, connelyslandscaping_dev]
                  periodSeconds: 2
                  failureThreshold: 30
  - <<: *ciPool
    metadata:
      name: mk-rentals-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/mk_rentals
        runnerScaleSetName: mk-rentals-ci
        maxRunners: 1
        template:
          spec:
            <<: *databasePod
            initContainers:
              - <<: *postgresSidecar
                args: ["-p", "5438", "-c", "listen_addresses=127.0.0.1"]
                env:
                  - name: POSTGRES_USER
                    value: dev
                  - name: POSTGRES_PASSWORD
                    value: devpassword
                  - name: POSTGRES_DB
                    value: mk_rentals_dev
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                startupProbe:
                  exec:
                    command: [pg_isready, -h, "127.0.0.1", -p, "5438", -U, dev, -d, mk_rentals_dev]
                  periodSeconds: 2

apiVersion: v1
kind: List
items:
  - &ciPool
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: deno-kit-ci
    spec: &ciPoolSpec
      suspend: false
      driftDetection:
        mode: enabled
      interval: 30m
      chartRef:
        kind: OCIRepository
        name: gha-runner-scale-set
      dependsOn:
        - name: actions-runner-controller
          namespace: actions-runner-system
      valuesFrom:
        - targetPath: githubConfigSecret.github_app_id
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_APP_ID
        - targetPath: githubConfigSecret.github_app_installation_id
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_INSTALLATION_ID
        - targetPath: githubConfigSecret.github_app_private_key
          kind: Secret
          name: actions-runner-controller-secret
          valuesKey: ACTION_RUNNER_CONTROLLER_GITHUB_PRIVATE_KEY
      values: &ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/deno-kit
        runnerScaleSetName: deno-kit-ci
        minRunners: 0
        maxRunners: 3
        controllerServiceAccount:
          name: actions-runner-controller
          namespace: actions-runner-system
        template:
          spec: &ciPod
            hostUsers: false
            automountServiceAccountToken: false
            securityContext:
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - &ciRunner
                name: runner
                image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
                command: ["/home/runner/run.sh"]
                securityContext: &ciSecurity
                  privileged: false
                  runAsNonRoot: true
                  runAsUser: 1001
                  runAsGroup: 1001
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 2Gi
                  limits:
                    cpu: 4
                    memory: 4Gi
                    ephemeral-storage: 10Gi
                volumeMounts:
                  - &workMount
                    name: work
                    mountPath: /home/runner/_work
            volumes:
              - &workVolume
                name: work
                emptyDir:
                  sizeLimit: 20Gi
  - <<: *ciPool
    metadata:
      name: site-fallback-worker-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/site-fallback-worker
        runnerScaleSetName: site-fallback-worker-ci
        maxRunners: 1
  - <<: *ciPool
    metadata:
      name: email-guard-worker-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/email-guard-worker
        runnerScaleSetName: email-guard-worker-ci
        maxRunners: 1
  - <<: *ciPool
    metadata:
      name: image-resize-worker-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/image-resize-worker
        runnerScaleSetName: image-resize-worker-ci
        maxRunners: 1
  - <<: *ciPool
    metadata:
      name: b7-leather-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/b7-leather
        runnerScaleSetName: b7-leather-ci
        maxRunners: 1
  - <<: *ciPool
    metadata:
      name: anytimesteel-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/anytimesteel
        runnerScaleSetName: anytimesteel-ci
        maxRunners: 1
        template:
          spec: &databasePod
            <<: *ciPod
            initContainers:
              - &postgresSidecar
                name: postgres
                # NOTE: the exact image of database/cloudnative-pg's cluster, so Renovate moves CI and
                # production in one PR. It has no docker-entrypoint; the command does its init.
                image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:f0b080688ea0435ea81f9e8b547cfffe4b177865c4e4f4501cef7ba3780ced0b
                command:
                  - bash
                  - -ec
                  - |
                    initdb -D "$PGDATA" -U "$POSTGRES_USER" -E UTF8 --locale=C --auth-local=trust --auth-host=scram-sha-256 --pwfile=<(printf '%s\n' "$POSTGRES_PASSWORD") >/dev/null
                    printf 'CREATE DATABASE "%s" OWNER "%s";\n' "$POSTGRES_DB" "$POSTGRES_USER" | postgres --single -D "$PGDATA" postgres >/dev/null
                    exec postgres -D "$PGDATA" -c unix_socket_directories= "$@"
                  - postgres-sidecar
                restartPolicy: Always
                securityContext:
                  <<: *ciSecurity
                  runAsUser: 26
                  runAsGroup: 26
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 2
                    memory: 3Gi
                volumeMounts:
                  - name: postgres-data
                    mountPath: /var/lib/postgresql/data
                  - name: postgres-shm
                    mountPath: /dev/shm
                args: ["-p", "5433", "-c", "listen_addresses=127.0.0.1"]
                env:
                  - name: POSTGRES_USER
                    value: anytimesteel
                  - name: POSTGRES_PASSWORD
                    value: devpassword
                  - name: POSTGRES_DB
                    value: anytimesteel
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                startupProbe:
                  exec:
                    command: [pg_isready, -h, "127.0.0.1", -p, "5433", -U, anytimesteel, -d, anytimesteel]
                  periodSeconds: 2
                  failureThreshold: 30
            containers:
              - &databaseRunner
                <<: *ciRunner
                image: ghcr.io/heavybullets8/business-runner:2.337.0@sha256:edf8251a4ca356b80c2dae07f4a2d8974b5e33624e11547972145728003fdc14
            volumes:
              - *workVolume
              - &postgresData
                name: postgres-data
                emptyDir:
                  medium: Memory
                  sizeLimit: 2Gi
              - &postgresShm
                name: postgres-shm
                emptyDir:
                  medium: Memory
                  sizeLimit: 256Mi
  - <<: *ciPool
    metadata:
      name: cloudpeakinsulation-ci
    spec:
      <<: *ciPoolSpec
      values:
        <<: *ciPoolValues
        githubConfigUrl: https://github.com/Heavybullets8/cloudpeakinsulation
        runnerScaleSetName: cloudpeakinsulation-ci
        maxRunners: 1
        template:
          spec:
            <<: *databasePod
            initContainers:
              - <<: *postgresSidecar
                args: ["-p", "5434", "-c", "listen_addresses=127.0.0.1"]
                env:
                  - name: POSTGRES_USER

                  periodSeconds: 2
                  failureThreshold: 30
              - <<: *buildkitSidecar
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                    ephemeral-storage: 512Mi
                  limits:
                    cpu: 4
                    memory: 30Gi
                    ephemeral-storage: 2Gi
            volumes:
              - *workVolume
              - *postgresData
              - *postgresShm
              - *buildkitSocket
              - <<: *buildkitState
                emptyDir:
                  medium: Memory
                  sizeLimit: 24Gi

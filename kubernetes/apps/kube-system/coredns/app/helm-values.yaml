---
fullnameOverride: coredns
k8sAppLabelOverride: kube-dns
replicaCount: 2
rollingUpdate:
  maxSurge: 1
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "10.96.0.10"
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class error
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      # TODO: remove once the ISP provides IPv6 and Cilium enable-ipv6 is turned on.
      # The cluster is IPv4-only, so AAAA answers are unroutable. Go resolves A and
      # AAAA in parallel and only errors if both fail, so a dropped A response leaves
      # an IPv6-only address list and the dial fails with "network is unreachable".
      # Returning NODATA for AAAA forces a clean fallback to A.
      - name: template
        parameters: IN AAAA .
        configBlock: |-
          rcode NOERROR
      - name: forward
        parameters: ". tls://1.1.1.1 tls://1.0.0.1"
        configBlock: |-
          tls_servername cloudflare-dns.com
          health_check 5s
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
        configBlock: |-
          class error
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

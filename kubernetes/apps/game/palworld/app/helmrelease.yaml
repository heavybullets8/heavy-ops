---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      palworld:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/thijsvanloef/palworld-server-docker
              tag: v2.7.1@sha256:401d3eb5c053bcd72949e1ede8c4e38be5e5ad66be7272ac37940706df0aeb2f
            env:
              TZ: ${TIMEZONE}
              PUID: "1000"
              PGID: "1000"
              PORT: &port "8211"
              QUERY_PORT: &queryPort "27015"
              PLAYERS: "16"
              BASE_CAMP_WORKER_MAX_NUM: "30"  # default 15
              BASE_CAMP_MAX_NUM_IN_GUILD: "10"  # default 4
              SERVER_NAME: "FrenZone"
              SERVER_DESCRIPTION: "FrenZone Palworld server"
              # community browser. Required for Xbox/PS5 players: consoles cannot
              COMMUNITY: "true"
              UPDATE_ON_BOOT: "true"
              # save + graceful shutdown on pod termination go through the REST API,
              # which authenticates as admin:${ADMIN_PASSWORD}
              REST_API_ENABLED: "true"
              REST_API_PORT: "8212"
              # RCON is deprecated upstream in favour of the REST API
              RCON_ENABLED: "false"
              # -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS
              # WORKER_THREADS_SERVER is left unset to keep the game's own default
              ENABLE_PERF_THREADING_ARGS: "true"
              # In-container save snapshots under /palworld/backups, for quick
              # rollback of a corrupt world. VolSync still backs up the whole PVC.
              BACKUP_ENABLED: "true"
              BACKUP_CRON_EXPRESSION: "0 5 * * *"
              DELETE_OLD_BACKUPS: "true"
              OLD_BACKUP_DAYS: "7"
            envFrom:
              - secretRef:
                  name: palworld-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - pgrep
                      - PalServer-Linux
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  # ~30m, the first boot has to download the ~10G server via SteamCMD
                  failureThreshold: 120
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 8Gi
              limits:
                memory: 24Gi

    defaultPodOptions:
      # the world is saved over the REST API before the server exits
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${PALWORLD_IP}"
        ports:
          game:
            primary: true
            port: *port
            protocol: UDP
            targetPort: *port
          query:
            enabled: true
            port: *queryPort
            protocol: UDP
            targetPort: *queryPort

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /palworld

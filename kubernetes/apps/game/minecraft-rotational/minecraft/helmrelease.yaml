---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-rotational
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      minecraft-rotational:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          patch-bedrock-reimagined:
            image: &serverImage
              repository: itzg/minecraft-bedrock-server
              tag: 2026.7.6@sha256:0bbd0562679ecef9e17c7f76f6dcc43e567ed7821e976caa4a47300798db1b49
            command:
              - /usr/bin/sh
              - /frenzone-patch/patch-bedrock-reimagined.sh
            securityContext:
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            resources:
              requests:
                memory: 32Mi
                cpu: 5m
              limits:
                memory: 256Mi
        containers:
          app:
            image: *serverImage
            env:
              TZ: ${TIMEZONE}
              UID: "1000"
              GID: "3000"
              EULA: "TRUE"
              GAMEMODE: survival
              DIFFICULTY: normal
              ALLOW_CHEATS: "false"
              MAX_PLAYERS: "20"
              ONLINE_MODE: "true"
              WHITE_LIST: "true"
              WHITE_LIST_USERS: "BoozeGuz,AKAJuiceBoxBoy,BigWizWyatt,DJVelveeta69,HeavyBullets88,BlackafroTTV,MediumYoda,PwNpRo,eelllliiee8368,KeeKs026,SpeedMcCheez,ElderSchnibs,HatiMoonPursuer,BigTonez00,Da Lupster,Pistol 414l,Myuh5852"
              OPS: "2535421636443049,2535410585100219"
              LEVEL_NAME: "level"
              SERVER_NAME: "Frenzone Rotate"
              SERVER_PORT: &port "19132"
              VIEW_DISTANCE: "15"
              TICK_DISTANCE: "4"
              PLAYER_IDLE_TIMEOUT: "30"
              MAX_THREADS: "0"
              TEXTUREPACK_REQUIRED: "true"
              # Keep Script API startup/runtime diagnostics visible in pod logs.
              CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"
              CONTENT_LOG_LEVEL: info
              # renovate: datasource=custom.bedrock depName=MinecraftBedrockServer versioning=loose
              VERSION: "1.26.36.1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeCommand
                    command:
                      - mc-monitor
                      - status-bedrock
                      - --host
                      - 127.0.0.1
                      - --port
                      - *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
            securityContext:
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
            resources:
              requests:
                memory: 512Mi
                cpu: 200m
              limits:
                cpu: 16
                memory: 20Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${MINECRAFT_ROTATIONAL_IP}"
        ports:
          minecraft:
            port: *port
            protocol: UDP
            targetPort: *port

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          minecraft-rotational:
            app:
              - path: /data
            patch-bedrock-reimagined:
              - path: /data
                readOnly: true
      pack-configs:
        type: configMap
        name: minecraft-rotational-pack-configs
        advancedMounts:
          minecraft-rotational:
            app:
              - path: /data/worlds/level/world_resource_packs.json
                subPath: world_resource_packs.json
              - path: /data/worlds/level/world_behavior_packs.json
                subPath: world_behavior_packs.json
      player-fishing-pack:
        type: configMap
        name: minecraft-rotational-player-fishing-pack
        items:
          - key: manifest.json
            path: manifest.json
          - key: main.js
            path: scripts/main.js
          - key: treasure.json
            path: loot_tables/frenzone/player_fishing_treasure.json
        advancedMounts:
          minecraft-rotational:
            app:
              - path: /data/behavior_packs/FrenZone-Player-Fishing-Perks
                readOnly: true
      bedrock-reimagined-patch:
        type: configMap
        name: minecraft-rotational-bedrock-reimagined-patch
        advancedMounts:
          minecraft-rotational:
            patch-bedrock-reimagined:
              - path: /frenzone-patch
                readOnly: true
      patched-bedrock-reimagined:
        type: emptyDir
        advancedMounts:
          minecraft-rotational:
            patch-bedrock-reimagined:
              - path: /patched-bedrock-reimagined
            app:
              - path: /data/behavior_packs/Bedrock-Reimagined-Behavior/scripts/imports.js
                subPath: imports.js
                readOnly: true
      tmp:
        type: emptyDir
        medium: Memory

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonwilds-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dragonwilds-secret
    template:
      data:
        RSDW_OWNER_ID: "{{ .OWNER_ID }}"
        RSDW_PASSWORD: "{{ .PASSWORD }}"
        RSDW_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"

  dataFrom:
    - extract:
        key: dragonwilds

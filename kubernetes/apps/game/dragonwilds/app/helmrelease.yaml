---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dragonwilds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      dragonwilds:
        # Only one server may write to the world at a time.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/runescape/rsdw-dedicated
              tag: 2.0.0@sha256:c35701edb05619fd28bfb37856b6a323c10bc8aa6466fb57b3e1b232936294dc
            env:
              TZ: ${TIMEZONE}
              RSDW_PORT: &port "7777"
              RSDW_SERVER_NAME: "FrenZone"
              RSDW_WORLD_NAME: "FrenZone"
              # SteamCMD updates on every boot. Opt out of mid-session restarts.
              RSDW_AUTO_STOP_ON_UPDATE: "false"
            envFrom:
              - secretRef:
                  name: dragonwilds-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  # UDP has no Kubernetes socket probe; check the bound game port.
                  exec: &probeCommand
                    command:
                      - bash
                      - -ec
                      - |
                        printf -v port '%04X' "$RSDW_PORT"
                        for table in /proc/net/udp /proc/net/udp6; do
                          [ -r "$table" ] || continue
                          while read -r _ address _; do
                            [[ "$address" == *:"$port" ]] && exit 0
                          done < "$table"
                        done
                        exit 1
                  initialDelaySeconds: 0
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *probeCommand
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  # Allow ~30m for SteamCMD to download the server on a fresh PVC.
                  failureThreshold: 120
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 1
                memory: 4Gi
              limits:
                memory: 16Gi

    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "${DRAGONWILDS_IP}"
        ports:
          game:
            primary: true
            port: *port
            protocol: UDP
            targetPort: *port
          beacon:
            port: 8888
            protocol: UDP
            targetPort: 8888

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /home/steam/rsdw-dedicated

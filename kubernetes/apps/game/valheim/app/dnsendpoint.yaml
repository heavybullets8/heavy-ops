---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: valheim
spec:
  endpoints:
    - dnsName: "valheim.${SECRET_DOMAIN}"
      recordType: CNAME
      recordTTL: 300
      targets:
        - "static.${SECRET_DOMAIN}"
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: mcxboxbroadcast-configmap
    files:
      - ./config/config.yml
  - name: mcxboxbroadcast-patch
    files:
      - ./patch/SessionManagerCore.java
      - ./patch/SessionManager.java
generatorOptions:
  disableNameSuffixHash: true


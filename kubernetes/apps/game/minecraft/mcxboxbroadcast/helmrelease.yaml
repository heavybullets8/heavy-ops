---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcxboxbroadcast
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      mcxboxbroadcast:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/mcxboxbroadcast/standalone
              tag: latest@sha256:8970858991b51bdbe19d13f6e68da843d99c5ed0e62d520007497feebbc3a428
            command: ["/bin/sh", "-c", "java -jar /opt/app/MCXboxBroadcastStandalone.jar 2>&1 | tee /tmp/app.log"]
            env:
              TZ: ${TIMEZONE}
            # checkConnection() only checks RTA and a local UDP bind, so NetherNet
            # can stop taking joins while everything still looks healthy. A good
            # join logs a nonce then a transfer ~6s later, so a nonce with no
            # transfer means it's wedged. RTA/reconnect are just backstops.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -e
                        find /tmp/app.log -mmin -5 | grep -q .
                        A=$(grep -ac 'RTA Websocket .* event:' /tmp/app.log || true)
                        if [ "$A" -gt 0 ]; then
                          [ "$A" = "$(cat /tmp/hb-rta 2>/dev/null)" ] || echo "$A" > /tmp/hb-rta
                          find /tmp/hb-rta -mmin -10 | grep -q .
                        fi
                        WS='WebSocket session reconnected'
                        WS="$WS\|NetherNet Broadcaster started on ID"
                        B=$(grep -ac "$WS" /tmp/app.log || true)
                        [ "$B" = "$(cat /tmp/hb-ws 2>/dev/null)" ] || echo "$B" > /tmp/hb-ws
                        find /tmp/hb-ws -mmin -240 | grep -q .
                        N=$(grep -ac 'Generated nonce for XUID' /tmp/app.log || true)
                        T=$(grep -ac 'Transferred bedrock client' /tmp/app.log || true)
                        if [ "$N" -le "$T" ] || [ "$T" != "$(cat /tmp/hb-join 2>/dev/null)" ]; then
                          echo "$T" > /tmp/hb-join
                        fi
                        find /tmp/hb-join -mmin -2 | grep -q .
                  initialDelaySeconds: 300
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            lifecycle:
              postStart:
                exec:
                  command: ["/bin/sh", "-c", "cp /config-template/config.yml /opt/app/config/config.yml"]

    persistence:
      config:
        existingClaim: mcxboxbroadcast-config
        globalMounts:
          - path: /opt/app/config

      config-file:
        type: configMap
        name: mcxboxbroadcast-configmap
        globalMounts:
          - path: /config-template/config.yml
            subPath: config.yml
            readOnly: true

      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp

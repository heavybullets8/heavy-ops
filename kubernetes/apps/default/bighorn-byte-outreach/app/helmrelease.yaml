---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-outreach
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      jobs:
        replicas: 2
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/bighorn-byte-outreach
              tag: sha-98e6fe7@sha256:98985b81cd1300d360f56524ae4f247002e328428549ac55c7f2edc21148d2a2
              pullPolicy: IfNotPresent
            args:
              - run
              - --cached-only
              - --frozen
              - --allow-all
              - scripts/outreach-worker.ts
              - jobs
            env: &env
              TZ: ${TIMEZONE}
              PORT: &port 8080
              OUTREACH_ENVIRONMENT: production
              OUTREACH_ENABLED: "1"
              BHB_PUBLIC_ORIGIN: https://bighornbyte.com
            envFrom: &envFrom
              - secretRef:
                  name: bighorn-byte-outreach-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      scheduler:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          timeZone: ${TIMEZONE}
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args:
              - run
              - --cached-only
              - --frozen
              - --allow-all
              - scripts/outreach-worker.ts
              - scheduler
              - --once
            resources: &scheduledResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

      mail:
        type: cronjob
        cronjob:
          schedule: "* * * * *"
          timeZone: ${TIMEZONE}
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args:
              - run
              - --cached-only
              - --frozen
              - --allow-all
              - scripts/outreach-worker.ts
              - mail
              - --once
            resources: *scheduledResources
            securityContext: *securityContext

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1200
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: jobs
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

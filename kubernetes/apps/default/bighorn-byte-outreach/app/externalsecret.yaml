---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bighorn-byte-outreach-secret
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bighorn-byte-outreach-secret
    template:
      data:
        ADMIN_DATABASE_URL: "{{ .ADMIN_DATABASE_URL }}"
        ADMIN_ENCRYPTION_KEYS: "{{ .ADMIN_ENCRYPTION_KEYS }}"
        ADMIN_ENCRYPTION_KEY_ID: "{{ .ADMIN_ENCRYPTION_KEY_ID }}"
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        OUTREACH_TAVILY_KEY: "{{ .OUTREACH_TAVILY_KEY }}"
        OUTREACH_GEOAPIFY_KEY: "{{ .OUTREACH_GEOAPIFY_KEY }}"
        R2_ACCOUNT_ID: "{{ .R2_ACCOUNT_ID }}"
        R2_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        R2_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
        R2_BUCKET_NAME: "{{ .R2_BUCKET_NAME }}"
        R2_PUBLIC_URL: "{{ .R2_PUBLIC_URL }}"
        OUTREACH_ARTIFACT_BUCKET: "{{ .OUTREACH_ARTIFACT_BUCKET }}"
        OUTREACH_PAGESPEED_KEY: '{{ index . "OUTREACH_PAGESPEED_KEY" | default "" }}'
        OUTREACH_PUSHOVER_API_TOKEN: '{{ index . "OUTREACH_PUSHOVER_API_TOKEN" | default "" }}'
        OUTREACH_PUSHOVER_USER_KEY: '{{ index . "OUTREACH_PUSHOVER_USER_KEY" | default "" }}'
        OUTREACH_BROWSER_URL: "ws://bighorn-byte-browser.default.svc.cluster.local:3000/{{ .BROWSER_WS_PATH }}"
  dataFrom:
    - extract:
        key: bighorn-byte-outreach-runtime

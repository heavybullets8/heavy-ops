---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app devbox
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      devbox:
        strategy: Recreate

        initContainers:
          seed-nix:
            image: &image
              repository: ghcr.io/heavybullets8/devbox
              tag: main@sha256:86ae6f98d47c7c681b54e71a9e6419692ee05b4e0dd306c86ab5f12eb6b84a63
            command: ["/bin/devbox-seed-nix"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image: *image
            resources:
              requests:
                cpu: 8
                memory: 96Gi
              limits:
                memory: 96Gi
            # NOTE: the entrypoint starts as root inside the user namespace to run
            # tailscaled, then runs sshd, herdr and the daily update as uid 1000.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              procMount: Unmasked
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "KILL", "SETGID", "SETUID"]

    defaultPodOptions:
      hostname: *app
      hostUsers: false
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/agent-runner-containerd-2.2.7.json

    persistence:
      home:
        existingClaim: devbox-home
        advancedMounts:
          devbox:
            app:
              - path: /home/heavy
              - path: /tmp
                subPath: .devbox/tmp
              - path: /var/lib/tailscale
                subPath: .devbox/tailscale
              - path: /etc/ssh
                subPath: .devbox/ssh
      nix:
        existingClaim: devbox-nix
        advancedMounts:
          devbox:
            seed-nix:
              - path: /mnt/nix
            app:
              - path: /nix
      run:
        type: emptyDir
        medium: Memory
        advancedMounts:
          devbox:
            app:
              - path: /run

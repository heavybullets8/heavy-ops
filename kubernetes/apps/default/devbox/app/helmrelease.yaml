---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app devbox
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      devbox:
        strategy: Recreate

        initContainers:
          seed-nix:
            image: &image
              repository: ghcr.io/heavybullets8/devbox
              tag: sha-6e6f261@sha256:5ab813ea5c1b33f7183c8601aad2c7f3aa5b3a1dad3f39e20348dbad77b7c15e
            command: ["/bin/devbox-seed-nix"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 100
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image: *image
            resources:
              requests:
                cpu: 8
                memory: 64Gi
              limits:
                memory: 64Gi
            # NOTE: the entrypoint starts as root inside the user namespace to run
            # tailscaled for Tailscale SSH, then runs sessions as uid 1000.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              procMount: Unmasked
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "KILL", "SETGID", "SETUID"]

    defaultPodOptions:
      hostname: *app
      hostUsers: false
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/agent-runner-containerd-2.2.7.json

    persistence:
      home:
        existingClaim: devbox-home
        advancedMounts:
          devbox:
            app:
              - path: /home/heavy
              - path: /tmp
                subPath: .devbox/tmp
              - path: /var/lib/tailscale
                subPath: .devbox/tailscale
      nix:
        existingClaim: devbox-nix
        advancedMounts:
          devbox:
            seed-nix:
              - path: /mnt/nix
            app:
              - path: /nix
      run:
        type: emptyDir
        medium: Memory
        advancedMounts:
          devbox:
            app:
              - path: /run

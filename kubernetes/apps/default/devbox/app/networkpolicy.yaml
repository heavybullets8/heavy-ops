---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: devbox
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: devbox
  ingressDeny:
    - fromEntities: [all]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.88.99.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
    # NOTE: kubectl and talosctl against this cluster, like the workstations.
    - toEntities: [host, kube-apiserver]
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "50000"
              protocol: TCP
    # NOTE: direct Tailscale paths to workstations on the home LAN; without
    # this, sessions from home fall back to DERP relays.
    - toCIDRSet:
        - cidr: 192.168.0.0/16
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
  egressDeny:
    - toEntities: [remote-node]

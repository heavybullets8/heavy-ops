---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app fcc-spam-reporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      fcc-spam-reporter:
        strategy: Recreate

        annotations:
          reloader.stakater.com/auto: "true"

        # One-time audited recovery; the single-writer lock is released before
        # the server starts. Remove after all seven jobs have been verified.
        initContainers:
          recover-failed-reports:
            image:
              repository: ghcr.io/heavybullets8/fcc-spam-reporter
              tag: v1.0.4@sha256:a1a58701762f76a70829a1bca75122cccf128b381850d7d4cf0674180786702d
              pullPolicy: IfNotPresent
            command: ["/app/docker/entrypoint.sh", "node", "/recovery/recover.mjs"]
            env:
              TZ: ${TIMEZONE}
              DATA_DIR: /app/data
              FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local:8191/v1
              SUBMIT: true
            envFrom:
              - secretRef:
                  name: fcc-spam-reporter-secret
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/fcc-spam-reporter
              tag: v1.0.4@sha256:a1a58701762f76a70829a1bca75122cccf128b381850d7d4cf0674180786702d
              pullPolicy: IfNotPresent

            env:
              TZ: ${TIMEZONE}
              HOST: 0.0.0.0
              PORT: &port 8080
              LOG_LEVEL: debug
              DATA_DIR: /app/data
              FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local:8191/v1
              SUBMIT: true
              QUO_COMMAND_MAX_AGE_MINUTES: "360"
            envFrom:
              - secretRef:
                  name: fcc-spam-reporter-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "fcc-spam-reporter.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      dshm:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /dev/shm

      recovery:
        type: configMap
        name: fcc-report-recovery-20261111
        globalMounts:
          - path: /recovery
            readOnly: true

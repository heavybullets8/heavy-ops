---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fcc-report-recovery-20261111
data:
  recover.mjs: |
    // One-time recovery of seven audited failed reports. Runs under the image's
    // flock guard as an init container, before the web server opens the database.
    import { DatabaseSync } from 'node:sqlite';
    import { mkdirSync, existsSync, writeFileSync, readFileSync } from 'node:fs';
    import { join } from 'node:path';
    import { config } from '/app/dist/app-config.js';
    import { SqliteStore } from '/app/dist/storage.js';
    import { createReportJobHandler } from '/app/dist/report-job-runner.js';
    import { runFccReport } from '/app/dist/fcc-reporter.js';
    import { fetchQuoContactSnapshot } from '/app/dist/quo-contacts.js';
    import { evaluateSpamRules } from '/app/dist/spam-rules.js';
    import { buildSpamRuleFacts, makeContactNumberFactId } from '/app/dist/spam-runtime.js';
    import { createLogger } from '/app/dist/logger.js';
    
    process.umask(0o077);
    const log = createLogger('recovery-20261111-cloudflare-retry');
    const auditedCalls = [
      ['307-249-2033', 'November 11, 2026'],
      ['307-370-7862', 'November 11, 2026'],
    ];
    const auditDir = join(config.server.dataDir, 'recovery-20261111-cloudflare-retry');
    mkdirSync(auditDir, { recursive: true, mode: 0o700 });
    const rawDb = new DatabaseSync(join(config.server.dataDir, 'store.db'));
    rawDb.exec('PRAGMA busy_timeout=5000');
    if (!existsSync(join(auditDir, 'before.db'))) {
      rawDb.prepare('VACUUM INTO ?').run(join(auditDir, 'before.db'));
    }
    const store = new SqliteStore(config.server.dataDir);
    await store.init();
    try {
      const jobs = await store.listJobs();
      const ids = auditedCalls.map(([number, date]) => {
        const matches = jobs.filter(job => job.reportData?.spamNumber === number && job.reportData?.callDate === date);
        if (matches.length !== 1) throw new Error('Recovery requires one exact call for ' + number + ' on ' + date);
        return matches[0].id;
      });
      if (!config.automation.submit || !config.quo.apiKey) throw new Error('Recovery requires production submission and contact access');
      const snapshot = await fetchQuoContactSnapshot({apiKey:config.quo.apiKey, baseUrl:config.quo.apiBaseUrl,timeoutMs:config.quo.apiTimeoutMs});
      for (const phoneNumber of snapshot.phoneNumbers) {
        await store.recordNumberFact({schemaVersion:1,id:makeContactNumberFactId(phoneNumber),disposition:'trusted',source:'contact',phoneNumber,createdAt:snapshot.fetchedAt});
      }
      await store.saveQuoContactSnapshot({schemaVersion:1,fetchedAt:snapshot.fetchedAt,phoneNumbers:[...snapshot.phoneNumbers]});
      const handler = createReportJobHandler({
        store: {
          claimJobExecution: id => store.claimJobExecution(id),
          readJob: id => store.readJob(id),
          saveJob: job => store.saveJob(job),
          artifactPath: id => join(store.artifactPath(id),'recovery-20261111-cloudflare-retry'),
          ensureArtifactDir: async id => {const dir=join(await store.ensureArtifactDir(id),'recovery-20261111-cloudflare-retry');mkdirSync(dir,{recursive:true,mode:0o700});return dir;},
        },
        config: {...config,automation:{...config.automation,delayMinMs:0,delayMaxMs:0}},
        refreshQuoContacts: async () => {}, // Fresh snapshot above; all retries run serially.
        isExactTrustedNumber: async callerNumber => {
          const decision=evaluateSpamRules({callerNumber,facts:buildSpamRuleFacts(config.matching,await store.listNumberFacts(),await store.listNumberControls()),configuredSpamRegexes:[],contactsFresh:false,now:new Date(),exactSpamRetentionDays:config.matching.exactSpamRetentionDays});
          return decision.action==='ignore' && decision.reason==='trusted-exact';
        },
        runFccReport,
        attemptTerminalNotification: async () => false,
        logger: log,
      });
      for (const id of ids) {
        const job=await store.readJob(id);
        if (!job) throw new Error('Missing audited recovery job ' + id);
        if (job.status==='succeeded') {log.info('already recovered',{jobId:id,caller:job.reportData.spamNumber});continue;}
        const marker=join(auditDir,id + '.json');
        if (existsSync(marker)) {log.warn('recovery already attempted; leaving durable status for review',{jobId:id,status:job.status});continue;}
        if (job.status!=='needs_review') throw new Error('Recovery refuses ' + job.status + ' job ' + id);
        const responseHtml = job.result?.artifacts.finalHtmlPath
          ? readFileSync(job.result.artifacts.finalHtmlPath, 'utf8') : '';
        if (job.result?.submissionConfirmed || !responseHtml.includes('<title>Just a moment...</title>') ||
            !responseHtml.includes('_cf_chl_opt') || responseHtml.includes('Your request was successfully submitted.')) {
          throw new Error('Recovery requires an audited Cloudflare-intercepted response for ' + id);
        }
        // Pace this audited retry instead of replaying the original seven-call burst.
        if (id !== ids[0]) await new Promise(resolve => setTimeout(resolve, 65_000));
        // Exclusive durable marker prevents a restart from replaying this attempt.
        // Keep the original job and its original artifacts; new artifacts use a subdir.
        writeFileSync(marker,JSON.stringify(job,null,2),{flag:'wx',mode:0o600});
        const queued={...job,status:'queued',updatedAt:new Date().toISOString(),result:undefined,errorMessage:undefined,terminalNotification:undefined};
        rawDb.exec('BEGIN IMMEDIATE');
        try {
          rawDb.prepare('DELETE FROM job_dispositions WHERE job_id=? AND disposition=?').run(id,'execute');
          rawDb.prepare('UPDATE report_jobs SET status=?,payload_json=? WHERE storage_key=? AND status=?').run('queued',JSON.stringify(queued),id,'needs_review');
          rawDb.exec('COMMIT');
        } catch(error) {rawDb.exec('ROLLBACK');throw error;}
        await handler(queued);
        const result=await store.readJob(id);
        log.info('recovery result',{jobId:id,caller:job.reportData.spamNumber,callDate:job.reportData.callDate,status:result.status,confirmed:result.result?.submissionConfirmed??false});
      }
    } finally {
      await store.close();rawDb.close();
    }

---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nextcloud-rec-1
spec:
  timeout: 15m
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: nextcloud

  values:
    image:
      flavor: fpm-alpine
      # renovate: datasource=docker depName=nextcloud
      tag: 34.0.2-fpm-alpine
    nginx:
      enabled: true

    phpClientHttpsFix:
      enabled: true
      protocol: https

    nextcloud:
      host: rec-1.${SECRET_DOMAIN}
      containerPort: 80

      existingSecret:
        enabled: true
        secretName: nextcloud-rec-1-secret
        usernameKey: NEXTCLOUD_USERNAME
        passwordKey: NEXTCLOUD_PASSWORD

      extraVolumes:
        - name: family-data
          nfs:
            server: ${TRUENAS_IP}
            path: /mnt/speed/spare
            readOnly: true
      extraVolumeMounts:
        - name: family-data
          mountPath: /family-data
          readOnly: true

      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '10.96.0.0/16',
              2 => '10.69.0.0/16',
            ),
            'trusted_domains' => array(
              0 => '127.0.0.1',
              1 => 'rec-1.${SECRET_DOMAIN}',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          ); ?>
        ingress.config.php: |-
          <?php
          $CONFIG = array (
            'overwrite.cli.url' => 'https://rec-1.${SECRET_DOMAIN}',
            'overwriteprotocol' => 'https',
          );
        misc.config.php: |-
          <?php
          $CONFIG = array (
            'default_phone_region' => 'US',
          );

      hooks:
        before-starting: |-
          #!/bin/sh
          OCC="php /var/www/html/occ"
          $OCC app:enable files_external || true

          mid() {
            php -r '$n=$argv[1];$j=json_decode(stream_get_contents(STDIN),true);if(is_array($j))foreach($j as $m){if(isset($m["mount_point"])&&strpos($m["mount_point"],$n)!==false){echo $m["mount_id"];break;}}' "$1" 2>/dev/null
          }

          ensure() {
            NAME="$1"; DIR="$2"
            if ! $OCC files_external:list --all --output=json 2>/dev/null | grep -q "$DIR"; then
              $OCC files_external:create "$NAME" local null::null -c datadir="$DIR" >/dev/null 2>&1
            fi
            ID=$($OCC files_external:list --all --output=json 2>/dev/null | mid "$NAME")
            if [ -n "$ID" ]; then
              $OCC files_external:option "$ID" readonly true >/dev/null 2>&1
              $OCC files_external:option "$ID" enable_sharing true >/dev/null 2>&1
              echo "ensured external mount '$NAME' (id=$ID) -> $DIR"
            else
              echo "WARN: '$NAME' present/created but could not read id to set options"
            fi
          }

          ensure "Tailey (private)" /family-data/tailey
          ensure "Family recovery"  /family-data/family
          exit 0

    internalDatabase:
      enabled: true
    externalDatabase:
      enabled: false

    persistence:
      enabled: true
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce
      size: 5Gi

    ingress:
      enabled: false

    cronjob:
      enabled: true

    startupProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 20
      successThreshold: 1

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 4Gi

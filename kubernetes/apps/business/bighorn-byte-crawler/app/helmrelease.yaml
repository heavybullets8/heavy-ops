---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-crawler
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      public-proxy:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-outreach
              tag: sha-771ee73e257dbd2fce41d0bb895f8c818ed8c2a5@sha256:ef3a77fa965d92f264147173dd22b2e642ad7f9bde81253578f7cac3d57a8141
              pullPolicy: Always
            args:
              - run
              - --cached-only
              - --frozen
              - --allow-env
              - --allow-net
              - scripts/outreach-proxy.ts
            env:
              OUTREACH_PUBLIC_PROXY_PORT: &proxyPort 8080
              OUTREACH_PROXY_MAX_CONNECTIONS: 128
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &proxyProbe
                    command:
                      - deno
                      - eval
                      - 'const connection = await Deno.connect({ hostname: "127.0.0.1", port: 8080 }); connection.close();'
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *proxyProbe
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *proxyProbe
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      solver:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-solver
              tag: sha-771ee73e257dbd2fce41d0bb895f8c818ed8c2a5@sha256:6ded327b8e7f4cc4d7779b69cefe7314d7fc51f82fad5e8d6ed4643dcee44bb9
              pullPolicy: Always
            env:
              CAPTCHA_SOLVER: "none"
              LOG_HTML: "false"
              LOG_LEVEL: warning
              PORT: &solverPort 8191
              PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &solverProbe
                    command:
                      - python3
                      - -c
                      - 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8191/health", timeout=2); raise SystemExit(0 if response.status == 200 else 1)'
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *solverProbe
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *solverProbe
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    service:
      public-proxy:
        forceRename: bighorn-byte-public-proxy
        controller: public-proxy
        ports:
          http:
            port: *proxyPort
      solver:
        forceRename: bighorn-byte-solver
        controller: solver
        ports:
          http:
            port: *solverPort

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          public-proxy:
            app:
              - path: /tmp
          solver:
            app:
              - path: /tmp
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          solver:
            app:
              - path: /dev/shm

# Web-only management capability: production API proof unlocks cutover; sandbox remains unavailable/held pending DEV credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bighorn-byte-connections-management-secret
  namespace: business
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bighorn-byte-connections-management-secret
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        BHB_CONNECTIONS_PRODUCTION_MANAGEMENT_ORIGIN: '{{ .BHB_CONNECTIONS_PRODUCTION_MANAGEMENT_ORIGIN }}'
        BHB_CONNECTIONS_PRODUCTION_MANAGEMENT_CREDENTIAL: '{{ .BHB_CONNECTIONS_PRODUCTION_MANAGEMENT_CREDENTIAL }}'
        BHB_CONNECTIONS_SANDBOX_MANAGEMENT_ORIGIN: '{{ .BHB_CONNECTIONS_SANDBOX_MANAGEMENT_ORIGIN }}'
        BHB_CONNECTIONS_SANDBOX_MANAGEMENT_CREDENTIAL: '{{ .BHB_CONNECTIONS_SANDBOX_MANAGEMENT_CREDENTIAL }}'
  dataFrom:
    - extract:
        key: bighorn-byte-connections-management

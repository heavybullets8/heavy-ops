---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bighorn-byte-web-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: bighorn-byte-web
        group: external
        url: https://bighornbyte.com/readyz
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] == 200"

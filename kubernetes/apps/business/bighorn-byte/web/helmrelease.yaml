---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-web
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      web:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.2.3@sha256:e86c5a8eaeca95927bcd829fea5033fed1a928159738ef13f7fc0e8d66c4f78d
              pullPolicy: Always
            env:
              BHB_CONNECTIONS_BACKEND: remote
              TZ: ${TIMEZONE}
              BHB_ENVIRONMENT: production
              DENO_ENV: production
              SITE_URL: https://bighornbyte.com
              BHB_MAINTENANCE_MODE: "0"
              BHB_PUBLIC_ORIGIN: https://bighornbyte.com
              OUTREACH_BROWSER_URL: "ws://bighorn-byte-browser.business.svc.cluster.local:3000/$(BROWSER_WS_PATH)"
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
              OUTREACH_SOLVER_URL: http://bighorn-byte-solver.business.svc.cluster.local:8191/v1
              OUTREACH_SOLVER_PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
              # NOTE: v24 env contract, added beside the current names; images before v24 ignore these.
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_demo
              ADMIN_PGDATABASE: bighorn_byte_admin
              AI_MODEL_EXTRACT: deepseek:deepseek-flash
              AI_MODEL_CLASSIFY: deepseek:deepseek-flash
              AI_MODEL_WRITE: deepseek:deepseek-flash
            envFrom:
              - secretRef:
                  name: bighorn-byte-web-secret
              - secretRef:
                  name: bighorn-byte-connections-management-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      migrate-demo:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-20"
        job: &migrationJob
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image: *image
            env:
              DIRECT_URL:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: DIRECT_URL
              # NOTE: the migration reads the same PG* names as the app after the v24 image.
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_demo
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: PGUSER
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: PGPASSWORD
            args: ["task", "db:deploy"]
            resources: &migrationResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: *securityContext

      migrate-admin:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job: *migrationJob
        containers:
          app:
            image: *image
            env:
              ADMIN_DIRECT_URL:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: ADMIN_DIRECT_URL
              # NOTE: ADMIN_PG* falls back to PGHOST and PGPORT for the shared server.
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              ADMIN_PGDATABASE: bighorn_byte_admin
              ADMIN_PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: ADMIN_PGUSER
              ADMIN_PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: ADMIN_PGPASSWORD
            args: ["task", "db:admin:deploy"]
            resources: *migrationResources
            securityContext: *securityContext

      indexnow:
        type: job
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "10"
        job:
          backoffLimit: 1
          activeDeadlineSeconds: 660
        containers:
          app:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              - |
                if [ -z "$BHB_SOURCE_REVISION" ]; then
                  echo 'IndexNow skipped: this image predates deployment revision checks.'
                  exit 0
                fi
                deno run --cached-only --frozen --node-modules-dir=none \
                  --allow-read=/app/static --allow-env=BHB_SOURCE_REVISION \
                  --allow-net=bighornbyte.com,api.indexnow.org \
                  /app/scripts/indexnow.ts --all --wait-seconds=600 || \
                  echo 'IndexNow submission failed; retry with the IndexNow workflow after checking the deployment.'
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext: *securityContext

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: web
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-crawler
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      public-proxy:
        replicas: 1
        strategy: Recreate
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.5.0@sha256:f62009b23fc89a9d58e0976a2ff1866713d37b5b1fa9f05d26f5cdd14d8edfaf
              pullPolicy: Always
            args: ["task", "proxy"]
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            env:
              OUTREACH_PUBLIC_PROXY_PORT: &proxyPort 8080
              OUTREACH_HOME_PROXY_PORT: &homePort 8081
              OUTREACH_PROXY_MAX_CONNECTIONS: 256
              OUTREACH_HOME_BUDGET_FILE: /var/lib/outreach-proxy/home-budget.json
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &proxyProbe
                    command:
                      - deno
                      - eval
                      - 'const connection = await Deno.connect({ hostname: "127.0.0.1", port: 8080 }); connection.close();'
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *proxyProbe
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *proxyProbe
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      solver:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-solver
              tag: 0.1.3@sha256:a0ca76cde85dc398c1f114825d1577c790645235b91e153d339f233b1b7c6d6d
              pullPolicy: Always
            env:
              CAPTCHA_SOLVER: "none"
              LOG_HTML: "false"
              LOG_LEVEL: warning
              PORT: &solverPort 8191
              PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
              PROXY_HOME_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8081
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &solverProbe
                    command:
                      - python3
                      - -c
                      - 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8191/health", timeout=2); raise SystemExit(0 if response.status == 200 else 1)'
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *solverProbe
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec: *solverProbe
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    service:
      public-proxy:
        forceRename: bighorn-byte-public-proxy
        controller: public-proxy
        ports:
          http:
            port: *proxyPort
          home:
            port: *homePort
      solver:
        forceRename: bighorn-byte-solver
        controller: solver
        ports:
          http:
            port: *solverPort

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          public-proxy:
            app:
              - path: /tmp
          solver:
            app:
              - path: /tmp
      state:
        existingClaim: bighorn-byte-proxy-state
        advancedMounts:
          public-proxy:
            app:
              - path: /var/lib/outreach-proxy
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          solver:
            app:
              - path: /dev/shm

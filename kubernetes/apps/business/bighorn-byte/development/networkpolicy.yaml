---
# Fictional demo: outbound network access is limited to DNS and its database.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bighorn-byte-development
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bighorn-byte-development
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

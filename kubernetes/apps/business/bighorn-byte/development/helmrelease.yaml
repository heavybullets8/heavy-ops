---
# Same application image and runtime contract, with isolated data and credentials.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bighorn-byte-development
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      web:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.5.0@sha256:f62009b23fc89a9d58e0976a2ff1866713d37b5b1fa9f05d26f5cdd14d8edfaf
              pullPolicy: Always
            env:
              TZ: ${TIMEZONE}
              SITE_URL: https://development.bighornbyte.com
              MAINTENANCE_MODE: "0"
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_development
              ADMIN_PGDATABASE: bighorn_byte_admin_development
              AI_MODEL_WRITE: anthropic:claude-haiku-5-5
              OUTREACH_ENABLED: "0"
              OUTREACH_MAIL_SEND_ENABLED: "0"
            envFrom:
              - secretRef:
                  name: bighorn-byte-development-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8000
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 2
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8000
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      migrate-demo:
        type: job
        # NOTE: Pre-install hooks run before the chart creates its service account.
        serviceAccount:
          name: default
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job:
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.5.0@sha256:f62009b23fc89a9d58e0976a2ff1866713d37b5b1fa9f05d26f5cdd14d8edfaf
              pullPolicy: Always
            env:
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_development
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-development-secret
                    key: PGUSER
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-development-secret
                    key: PGPASSWORD
            args:
              - task
              - db:deploy
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      migrate-admin:
        type: job
        serviceAccount:
          name: default
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job:
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.5.0@sha256:f62009b23fc89a9d58e0976a2ff1866713d37b5b1fa9f05d26f5cdd14d8edfaf
              pullPolicy: Always
            env:
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              ADMIN_PGDATABASE: bighorn_byte_admin_development
              ADMIN_PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-development-secret
                    key: ADMIN_PGUSER
              ADMIN_PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-development-secret
                    key: ADMIN_PGPASSWORD
            args:
              - task
              - db:admin:deploy
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: web
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

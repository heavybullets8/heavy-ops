---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-outreach
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      jobs:
        replicas: 1
        strategy: Recreate
        annotations: &reload
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: 0.4.6@sha256:69aa95283d5c8ba8acf7de54058dbc9b6f8a68d351373f09951f6541f771c37e
              pullPolicy: Always
            env: &env
              TZ: ${TIMEZONE}
              SITE_URL: https://bighornbyte.com
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_demo
              ADMIN_PGDATABASE: bighorn_byte_admin
              AI_MODEL_EXTRACT: anthropic:claude-haiku-5-5
              AI_MODEL_CLASSIFY: anthropic:claude-haiku-5-5
              AI_MODEL_WRITE: anthropic:claude-haiku-5-5
              BHB_CONNECTIONS_BACKEND: remote
              OUTREACH_ENABLED: "1"
              OUTREACH_BROWSER_URL: "ws://bighorn-byte-browser.business.svc.cluster.local:3000/$(BROWSER_WS_PATH)"
              OUTREACH_BROWSER_INTERNAL_ORIGIN: http://bighorn-byte-web.business.svc.cluster.local:8000
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
              OUTREACH_SOLVER_URL: http://bighorn-byte-solver.business.svc.cluster.local:8191/v1
              OUTREACH_SOLVER_PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
              OUTREACH_HOME_PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8081
            envFrom: &envFrom
              - secretRef:
                  name: bighorn-byte-outreach-secret
            args: ["task", "worker"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            lifecycle: &preStop
              preStop:
                sleep:
                  seconds: 5
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      mcp:
        replicas: 1
        strategy: RollingUpdate
        annotations: *reload
        pod:
          terminationGracePeriodSeconds: 30
        containers:
          app:
            image: *image
            env:
              TZ: ${TIMEZONE}
              SITE_URL: https://bighornbyte.com
              PGHOST: postgres-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: bighorn_byte_demo
              ADMIN_PGDATABASE: bighorn_byte_admin
              AI_MODEL_EXTRACT: anthropic:claude-haiku-5-5
              AI_MODEL_CLASSIFY: anthropic:claude-haiku-5-5
              AI_MODEL_WRITE: anthropic:claude-haiku-5-5
              BHB_CONNECTIONS_BACKEND: remote
              OUTREACH_MCP_PUBLIC_URL: https://outreach-mcp.${SECRET_DOMAIN}
              OUTREACH_MCP_ISSUER: https://auth.${SECRET_DOMAIN}
              OUTREACH_MCP_OWNER_SUBJECTS: 463c69e1-db21-4eb3-8b29-bf87dbced4df
            envFrom: *envFrom
            args: ["task", "mcp"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            lifecycle: *preStop
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1
                memory: 512Mi
            securityContext: *securityContext

      run-outreach-scheduler:
        type: cronjob
        annotations: *reload
        cronjob: &cronjob
          schedule: "*/5 * * * *"
          timeZone: ${TIMEZONE}
          suspend: false
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          backoffLimit: 2
          activeDeadlineSeconds: 900
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod: &jobPod
          restartPolicy: Never
        containers:
          app: &jobContainer
            image: *image
            env:
              <<: *env
              JOB_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            envFrom: *envFrom
            args: ["task", "job", "run-outreach-scheduler"]
            resources: &scheduledResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

      send-outreach-mail:
        type: cronjob
        annotations: *reload
        pod: *jobPod
        cronjob:
          <<: *cronjob
          schedule: "* * * * *"
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "send-outreach-mail"]

      run-hourly-maintenance:
        type: cronjob
        annotations: *reload
        pod: *jobPod
        cronjob:
          <<: *cronjob
          schedule: "20 * * * *"
          timeZone: Etc/UTC
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "run-hourly-maintenance"]

      run-daily-maintenance:
        type: cronjob
        annotations: *reload
        pod: *jobPod
        cronjob:
          <<: *cronjob
          schedule: "50 10 * * *"
          timeZone: Etc/UTC
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "run-daily-maintenance"]

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1200
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: jobs
        ports:
          http:
            port: *port
      mcp:
        controller: mcp
        ports:
          http:
            port: *port

    route:
      mcp:
        hostnames:
          - "outreach-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: mcp
                port: *port

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp

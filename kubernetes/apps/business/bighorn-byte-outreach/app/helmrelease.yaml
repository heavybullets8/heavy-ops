---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-outreach
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      jobs:
        replicas: 1
        strategy: Recreate
        annotations: &reload
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/bighorn-byte-outreach
              tag: sha-5443fc98e5d8c283bad5e03a5fce80e1af68ac72@sha256:9cc0ed788b32a02af36f364cb145f7ac28edb6c0584131ca56155bef80d7fc83
              pullPolicy: Always
            env: &env
              TZ: ${TIMEZONE}
              BHB_ENVIRONMENT: production
              BHB_CRON_ENABLED: "0"
              BHB_PUBLIC_ORIGIN: https://bighornbyte.com
              OUTREACH_ENVIRONMENT: production
              OUTREACH_ENABLED: "1"
              OUTREACH_BROWSER_PROVIDER: playwright
              OUTREACH_BROWSER_URL: "ws://bighorn-byte-browser.business.svc.cluster.local:3000/$(BROWSER_WS_PATH)"
              OUTREACH_BROWSER_INTERNAL_ORIGIN: http://bighorn-byte-web.business.svc.cluster.local:8000
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
              OUTREACH_SOLVER_URL: http://bighorn-byte-solver.business.svc.cluster.local:8191/v1
              OUTREACH_SOLVER_PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
            envFrom: &envFrom
              - secretRef:
                  name: bighorn-byte-outreach-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      scheduler:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "*/5 * * * *"
          timeZone: ${TIMEZONE}
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/outreach-worker.ts", "scheduler", "--once"]
            resources: &scheduledResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

      mail:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "* * * * *"
          timeZone: ${TIMEZONE}
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/outreach-worker.ts", "mail", "--once"]
            resources: *scheduledResources
            securityContext: *securityContext

      hourly-maintenance:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "20 * * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/app-maintenance.ts", "hourly", "--once"]
            resources: *scheduledResources
            securityContext: *securityContext

      daily-maintenance:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "50 10 * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/app-maintenance.ts", "daily", "--once"]
            resources: *scheduledResources
            securityContext: *securityContext

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1200
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: jobs
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp

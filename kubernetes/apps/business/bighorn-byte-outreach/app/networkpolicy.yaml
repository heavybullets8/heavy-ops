---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bighorn-byte-outreach-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bighorn-byte-outreach
      app.kubernetes.io/controller: mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres16
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # NOTE: Authelia's JWKS, fetched through its public hostname as the agent runner does.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidr: 169.254.0.0/16
        - cidr: 100.64.0.0/10

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-runner
  namespace: &namespace business
spec:
  # Provider jobs remain disabled until the live runtime probes pass.
  suspend: false
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/forward-auth
  dependsOn:
    - name: onepassword
      namespace: external-secrets
  path: ./kubernetes/apps/business/agent-runner/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: agent-runner-dashboard
  wait: false
  interval: 30m
  timeout: 15m

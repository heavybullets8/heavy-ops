---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-runner
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: agent-runner

  values:
    imagePullSecrets:
      - name: business-ghcr

    deployment:
      annotations:
        secret.reloader.stakater.com/reload: agent-runner-credentials

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 1
        memory: 3Gi
        ephemeral-storage: 512Mi

    tmp:
      medium: Memory

    persistence:
      existingClaim: agent-runner-data

    credentials:
      existingSecret: agent-runner-credentials

    route:
      enabled: true
      hostnames:
        - "agent-runner.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network

    session:
      enabled: true

    dashboard:
      enabled: true
      hostname: "agents.${SECRET_DOMAIN}"
      viewers:
        - kyler
      parentRefs:
        - name: envoy-external
          namespace: network

    networkPolicy:
      podCIDR: 10.69.0.0/16
      controllerIngressNamespaces:
        - network

    config:
      public_url: https://agent-runner.${SECRET_DOMAIN}
      issuer: https://auth.${SECRET_DOMAIN}
      jwks_url: https://auth.${SECRET_DOMAIN}/jwks.json
      package_scope: '@heavybullets8'
      owners:
        - 463c69e1-db21-4eb3-8b29-bf87dbced4df
      providers:
        claude: true
        codex: true
      repositories:
        runner:
          github: heavybullets8/heavy-ops-agent-runner
          checks:
            format:
              - deno
              - fmt
              - --check
            lint:
              - deno
              - lint
            check:
              - deno
              - task
              - check
            test:
              - deno
              - task
              - test
        heavy-ops:
          github: heavybullets8/heavy-ops
          checks: {}
      queue_limit: 8
      retention_days: 7
      max_source_bytes: 67108864
      provider_policies:
        claude:
          default_model: claude-opus-5-5
          allowed_models:
            - claude-opus-5-5
          child_model: inherit
          max_parallel_jobs: 2
          max_concurrent_children: 2
          child_max_turns: 12
          model_efforts:
            claude-opus-5-5:
              default: xhigh
              supported:
                - low
                - medium
                - high
                - xhigh
                - max
              allowed:
                - low
                - medium
                - high
                - xhigh
                - max
        codex:
          default_model: gpt-6.1-sol
          allowed_models:
            - gpt-6.1-sol
          child_model: inherit
          max_parallel_jobs: 1
          max_concurrent_children: 2
          child_max_turns: 12
          model_efforts:
            gpt-6.1-sol:
              default: xhigh
              supported:
                - low
                - medium
                - high
                - xhigh
                - max
              allowed:
                - low
                - medium
                - high
                - xhigh
                - max

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app agent-runner
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      agent-runner:
        # Controller starts before provider jobs are enabled.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: *app
        containers:
          app:
            image:
              repository: ghcr.io/heavybullets8/heavy-ops-agent-runner-controller
              tag: candidate@sha256:5937c8122907d7c840a15a1262cdb25e9a764750a40163af30e84674a9ef7bf8
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 128Mi
              limits:
                cpu: 1
                memory: 1Gi
                ephemeral-storage: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: true
      enableServiceLinks: true
      hostUsers: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
          worker:
            port: 8081

    route:
      app:
        hostnames:
          - "agent-runner.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: agent-runner-data
        globalMounts:
          - path: /data
      config:
        type: configMap
        name: agent-runner-configmap
        globalMounts:
          - path: /config
            readOnly: true
      credentials:
        type: secret
        name: agent-runner-credentials
        defaultMode: 0440
        globalMounts:
          - path: /credentials
            readOnly: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runner
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runner
subjects:
  - kind: ServiceAccount
    name: agent-runner

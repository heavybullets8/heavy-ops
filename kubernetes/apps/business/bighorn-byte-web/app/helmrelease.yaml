---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bighorn-byte-web
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      web:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/bighorn-byte-web
              tag: sha-76021d3e20b7fdc545e44b92e2eee90d3042a132@sha256:2cd75fdb41e5296804f9c0af90bb8cd3b69f86d32f628aad9e2f7d788fb3b172
              pullPolicy: Always
            env:
              TZ: ${TIMEZONE}
              BHB_ENVIRONMENT: production
              DENO_ENV: production
              SITE_URL: https://bighornbyte.com
              BHB_MAINTENANCE_MODE: "0"
              BHB_CRON_ENABLED: "0"
              OUTREACH_DEPLOY_ROLES: ""
              BHB_PUBLIC_ORIGIN: https://bighornbyte.com
              OUTREACH_BROWSER_PROVIDER: playwright
              OUTREACH_BROWSER_URL: "ws://bighorn-byte-browser.business.svc.cluster.local:3000/$(BROWSER_WS_PATH)"
              OUTREACH_PROXY_URL: socks5://qbittorrent-gluetun.media.svc.cluster.local:8388
              OUTREACH_SOLVER_URL: http://bighorn-byte-solver.business.svc.cluster.local:8191/v1
              OUTREACH_SOLVER_PROXY_URL: http://bighorn-byte-public-proxy.business.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: bighorn-byte-web-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      migrate-demo:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-20"
        job: &migrationJob
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image: *image
            env:
              DIRECT_URL:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: DIRECT_URL
            args: ["task", "db:deploy"]
            resources: &migrationResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: *securityContext

      migrate-admin:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job: *migrationJob
        containers:
          app:
            image: *image
            env:
              ADMIN_DIRECT_URL:
                valueFrom:
                  secretKeyRef:
                    name: bighorn-byte-web-secret
                    key: ADMIN_DIRECT_URL
            args: ["task", "db:admin:deploy"]
            resources: *migrationResources
            securityContext: *securityContext

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: web
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

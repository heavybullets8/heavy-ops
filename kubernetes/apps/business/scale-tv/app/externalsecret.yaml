---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scale-tv-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: scale-tv-secret
    template:
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        DIRECT_URL: "{{ .DIRECT_URL }}"
        STRIPE_SECRET_KEY: "{{ .STRIPE_SECRET_KEY }}"
        STRIPE_PUBLISHABLE_KEY: "{{ .STRIPE_PUBLISHABLE_KEY }}"
        STRIPE_WEBHOOK_SECRET: "{{ .STRIPE_WEBHOOK_SECRET }}"
        STRIPE_PRICE_MONTHLY: "{{ .STRIPE_PRICE_MONTHLY }}"
        STRIPE_PRICE_YEARLY: "{{ .STRIPE_PRICE_YEARLY }}"
        PLEX_OWNER_TOKEN: "{{ .PLEX_OWNER_TOKEN }}"
        PLEX_MACHINE_ID: "{{ .PLEX_MACHINE_ID }}"
        PLEX_CLIENT_ID: "{{ .PLEX_CLIENT_ID }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
        TURNSTILE_SITE_KEY: "{{ .TURNSTILE_SITE_KEY }}"
        TURNSTILE_SECRET_KEY: "{{ .TURNSTILE_SECRET_KEY }}"
        PLEX_LIBRARY_SECTION_IDS: '{{ index . "PLEX_LIBRARY_SECTION_IDS" | default "" }}'
        CLOUDFLARE_EMAIL_API_TOKEN: '{{ index . "CLOUDFLARE_EMAIL_API_TOKEN" | default "" }}'
        CLOUDFLARE_ACCOUNT_ID: '{{ index . "CLOUDFLARE_ACCOUNT_ID" | default "" }}'
        EMAIL_FROM: '{{ index . "EMAIL_FROM" | default "" }}'
        ADMIN_CONTACT_EMAIL: '{{ index . "ADMIN_CONTACT_EMAIL" | default "" }}'
        SCALE_TV_MAINTENANCE_MODE: '{{ index . "SCALE_TV_MAINTENANCE_MODE" | default "0" }}'
  dataFrom:
    - extract:
        key: scale-tv-business-runtime

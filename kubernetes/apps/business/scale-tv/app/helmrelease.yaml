---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scale-tv
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      web:
        replicas: 1
        strategy: RollingUpdate
        annotations: &reload
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/scale-tv
              tag: 0.2.0@sha256:0a400098e45853de4105091e4728131213bd89566fd333d51f5eec5b437b0ba8
              pullPolicy: Always
            env: &env
              TZ: ${TIMEZONE}
              SITE_URL: https://tv.bighornbyte.com
              MAINTENANCE_MODE: "0"
              PGHOST: postgres16-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: scale_tv
              EMAIL_FROM: SCALE TV <no-reply@tv.bighornbyte.com>
              ADMIN_CONTACT_EMAIL: kyler@bighornbyte.com
              PLEX_MACHINE_ID: 0c253b083be8c13680cab7eabe4d7739d403b554
              PLEX_CLIENT_ID: 1b8ce7ac-ec7b-49a6-9219-98e594d6ff68
              PLEX_LIBRARY_SECTION_IDS: "126752770,126752776,126752794,126752786"
              STRIPE_PRICE_MONTHLY: price_1RsrFjHSEDqoA430tuRCK3F5
              STRIPE_PRICE_YEARLY: price_1TqcmLHSEDqoA430aJ7WX5KT
            envFrom: &envFrom
              - secretRef:
                  name: scale-tv-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      migrate:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job:
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image: *image
            env:
              <<: *env
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: scale-tv-secret
                    key: PGUSER
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: scale-tv-secret
                    key: PGPASSWORD
            args: ["task", "db:deploy"]
            resources: &jobResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: *securityContext

      hourly-maintenance:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "0 * * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/maintenance.ts", "hourly"]
            resources: *jobResources
            securityContext: *securityContext

      nightly-maintenance:
        type: cronjob
        annotations: *reload
        cronjob:
          schedule: "0 9 * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 1200
          successfulJobsHistory: 1
          failedJobsHistory: 2
        containers:
          app:
            image: *image
            env: *env
            envFrom: *envFrom
            args: ["run", "--cached-only", "--frozen", "--allow-all", "scripts/maintenance.ts", "nightly"]
            resources: *jobResources
            securityContext: *securityContext

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: web
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

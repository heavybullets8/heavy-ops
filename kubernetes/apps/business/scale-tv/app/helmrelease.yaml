---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scale-tv
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      web:
        replicas: 1
        strategy: RollingUpdate
        annotations: &reload
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/heavybullets8/scale-tv
              tag: 0.3.0@sha256:34c80034a6846143d1a1c08703219b434058fa10b0ef63610ba81e64e5626733
              pullPolicy: Always
            env: &env
              TZ: ${TIMEZONE}
              SITE_URL: https://tv.bighornbyte.com
              MAINTENANCE_MODE: "0"
              PGHOST: postgres16-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASE: scale_tv
              EMAIL_FROM: SCALE TV <no-reply@tv.bighornbyte.com>
              ADMIN_CONTACT_EMAIL: kyler@bighornbyte.com
              PLEX_MACHINE_ID: 0c253b083be8c13680cab7eabe4d7739d403b554
              PLEX_CLIENT_ID: 1b8ce7ac-ec7b-49a6-9219-98e594d6ff68
              PLEX_LIBRARY_SECTION_IDS: "126752770,126752776,126752794,126752786"
              STRIPE_PRICE_MONTHLY: price_1RsrFjHSEDqoA430tuRCK3F5
              STRIPE_PRICE_YEARLY: price_1TqcmLHSEDqoA430aJ7WX5KT
            envFrom: &envFrom
              - secretRef:
                  name: scale-tv-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 2
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            lifecycle:
              preStop:
                sleep:
                  seconds: 5
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      migrate:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
          helm.sh/hook-weight: "-10"
        job:
          backoffLimit: 1
          activeDeadlineSeconds: 600
        containers:
          app:
            image: *image
            env:
              <<: *env
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: scale-tv-secret
                    key: PGUSER
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: scale-tv-secret
                    key: PGPASSWORD
            args: ["task", "db:deploy"]
            resources: &jobResources
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
            securityContext: *securityContext

      sweep-member-coverage:
        type: cronjob
        annotations: *reload
        cronjob: &cronjob
          schedule: "0 * * * *"
          timeZone: Etc/UTC
          suspend: false
          concurrencyPolicy: Forbid
          backoffLimit: 2
          activeDeadlineSeconds: 900
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app: &jobContainer
            image: *image
            env:
              <<: *env
              JOB_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            envFrom: *envFrom
            args: ["task", "job", "sweep-member-coverage"]
            resources: *jobResources
            securityContext: *securityContext

      sweep-invites-sessions:
        type: cronjob
        annotations: *reload
        cronjob:
          <<: *cronjob
          schedule: "0 * * * *"
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "sweep-invites-sessions"]

      reconcile-members:
        type: cronjob
        annotations: *reload
        cronjob:
          <<: *cronjob
          schedule: "0 9 * * *"
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "reconcile-members"]

      reconcile-shares:
        type: cronjob
        annotations: *reload
        cronjob:
          <<: *cronjob
          schedule: "0 9 * * *"
        containers:
          app:
            <<: *jobContainer
            args: ["task", "job", "reconcile-shares"]

    defaultPodOptions:
      imagePullSecrets:
        - name: business-ghcr
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: web
        ports:
          http:
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

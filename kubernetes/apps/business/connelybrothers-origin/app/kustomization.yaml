---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: business
components:
  - ../../../../components/connelybrothers-origin
patches:
  - path: ./helmrelease.yaml
configMapGenerator:
  - name: connelybrothers-origin-config
    namespace: business
    files:
      - site.caddy
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./httproute.yaml
  - ./dnsendpoint.yaml

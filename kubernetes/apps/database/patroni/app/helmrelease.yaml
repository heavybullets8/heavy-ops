---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app patroni
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      patroni:
        type: statefulset
        strategy: OnDelete
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        defaultContainerOptionsStrategy: merge
        defaultContainerOptions:
          image:
            repository: ghcr.io/heavybullets8/cb-ha-transport
            tag: 0.1.1@sha256:7d6d0eb0b53bc971d148c3fba95ce00b1215df2f92436d38a52b004539919441
            pullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
        containers:
          db:
            env:
              HA_REWIND_PGDATA: /ha-data/postgres
              HA_REWIND_QUARANTINE: /ha-forensics
              PATRONI_NAME: home
            envFrom:
              - secretRef:
                  name: patroni-secret
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: '2'
                memory: 1Gi
            image: &image
              repository: ghcr.io/heavybullets8/postgres-patroni
              tag: 18.6.3@sha256:40203970920660e6ea365c7f1c5de2b1191081644cad1644079f1fea66718324
              pullPolicy: IfNotPresent
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/patroni/bin/python
                      - -c
                      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status == 200
                  periodSeconds: 3
                  failureThreshold: 60
                  timeoutSeconds: 1
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/patroni/bin/python
                      - -c
                      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status == 200
                  periodSeconds: 3
                  failureThreshold: 3
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/patroni/bin/python
                      - -c
                      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8008/liveness', timeout=0.8).status == 200
                  periodSeconds: 3
                  failureThreshold: 1
                  timeoutSeconds: 1
          etcd:
            command:
              - /usr/local/bin/etcd
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: '1'
                memory: 512Mi
            image:
              repository: registry.k8s.io/etcd
              tag: 3.7.2-0
              pullPolicy: Always
            args:
              - --name=home
              - --data-dir=/ha-data/etcd
              - --listen-client-urls=http://127.0.0.1:22379
              - --advertise-client-urls=http://127.0.0.1:22379
              - --listen-peer-urls=http://127.0.0.1:22380
              - --initial-advertise-peer-urls=http://127.0.0.1:22380
              - --initial-cluster=home=http://127.0.0.1:22380,cloud=http://127.0.0.1:32380,voter=http://127.0.0.1:12380
              - --initial-cluster-token=business-ha-production-20261003
              - --initial-cluster-state=new
              - --heartbeat-interval=250
              - --election-timeout=2500
              - --log-level=warn
          pgbackrest-scheduler:
            command:
              - /opt/patroni/bin/python
              - /opt/ha/backup_scheduler.py
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: '1'
                memory: 512Mi
            image: *image
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9187
                  periodSeconds: 15
                  failureThreshold: 3
            args:
              - --site
              - home
              - --stanza
              - connely-ha-production
              - --state-dir
              - /ha-forensics/backup-scheduler
              - --primary-url
              - http://127.0.0.1:8008/primary
              - --metrics-port
              - '9187'
          wal-metrics:
            command:
              - /opt/patroni/bin/python
              - /opt/ha/wal_metrics.py
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            image: *image
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /opt/patroni/bin/python
                      - -c
                      - import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:9188/healthz',timeout=1).status==200
                  periodSeconds: 5
                  timeoutSeconds: 2
          ssh-voter:
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            args:
              - client
              - -L127.0.0.1:12379:127.0.0.1:12379
              - -L127.0.0.1:12380:127.0.0.1:12380
              - -R127.0.0.1:22379:127.0.0.1:22379
              - -R127.0.0.1:22380:127.0.0.1:22380
              - -R127.0.0.1:25432:127.0.0.1:5432
              - -R127.0.0.1:28008:127.0.0.1:8008
              - ha-prod-tunnel@95.111.215.193
          ssh-cloud:
            args:
              - client
              - -p
              - '8443'
              - -L127.0.0.1:32379:127.0.0.1:32379
              - -L127.0.0.1:32380:127.0.0.1:32380
              - -L0.0.0.0:25433:127.0.0.1:5432
              - -L127.0.0.1:28009:127.0.0.1:8008
              - -R127.0.0.1:22379:127.0.0.1:22379
              - -R127.0.0.1:22380:127.0.0.1:22380
              - -R0.0.0.0:25432:127.0.0.1:5432
              - -R127.0.0.1:28008:127.0.0.1:8008
              - ha-tunnel@209.50.58.65
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
        initContainers:
          prepare-volumes:
            command:
              - /bin/sh
              - -ec
            args:
              - mkdir -p /ha-data/postgres /ha-data/etcd; chown 999:999 /ha-data /ha-data/postgres /ha-data/etcd /ha-forensics /var/run/postgresql; chmod 0700 /ha-data/postgres /ha-forensics; chmod 0770 /var/run/postgresql
            securityContext:
              runAsUser: 0
              capabilities:
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
            image: *image
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: business-ghcr
      nodeSelector:
        kubernetes.io/hostname: heavy-control
    service:
      app:
        forceRename: *app
        controller: *app
        ports:
          postgres:
            port: 5432
            targetPort: 5432
          peer:
            port: 5433
            targetPort: 25433
          patroni:
            port: 8008
            targetPort: 8008
          backup-metrics:
            port: 9187
            targetPort: 9187
          wal-metrics:
            port: 9188
            targetPort: 9188
    persistence:
      data:
        existingClaim: *app
        globalMounts: []
        advancedMounts:
          patroni:
            etcd:
              - path: /ha-data
            db:
              - path: /ha-data
            pgbackrest-scheduler:
              - path: /ha-data
            prepare-volumes:
              - path: /ha-data
      forensic:
        existingClaim: patroni-forensic
        globalMounts: []
        advancedMounts:
          patroni:
            db:
              - path: /ha-forensics
            pgbackrest-scheduler:
              - path: /ha-forensics
            prepare-volumes:
              - path: /ha-forensics
      postgres-socket:
        type: emptyDir
        sizeLimit: 16Mi
        globalMounts: []
        advancedMounts:
          patroni:
            db:
              - path: /var/run/postgresql
            pgbackrest-scheduler:
              - path: /var/run/postgresql
            wal-metrics:
              - path: /var/run/postgresql
            prepare-volumes:
              - path: /var/run/postgresql
      site-config:
        type: configMap
        name: patroni-configmap
        defaultMode: 365
        globalMounts: []
        advancedMounts:
          patroni:
            db:
              - path: /etc/patroni.yml
                subPath: patroni.yml
                readOnly: true
      backrest:
        type: secret
        defaultMode: 292
        name: patroni-backup-secret
        globalMounts: []
        advancedMounts:
          patroni:
            db:
              - path: /etc/pgbackrest/pgbackrest.conf
                subPath: pgbackrest.conf
                readOnly: true
            pgbackrest-scheduler:
              - path: /etc/pgbackrest/pgbackrest.conf
                subPath: pgbackrest.conf
                readOnly: true
      ssh-client-identity:
        type: secret
        defaultMode: 256
        items:
          - key: id_ed25519
            path: id_ed25519
          - key: known_hosts
            path: known_hosts
        name: patroni-ssh-secret
        globalMounts: []
        advancedMounts:
          patroni:
            ssh-voter:
              - path: /etc/ha-ssh
                readOnly: true
            ssh-cloud:
              - path: /etc/ha-ssh
                readOnly: true
      runtime-scripts:
        type: configMap
        name: patroni-scripts
        defaultMode: 365
        globalMounts: []
        advancedMounts:
          patroni:
            db:
              - path: /opt/ha/pg_rewind
                subPath: pg_rewind
                readOnly: true
            pgbackrest-scheduler:
              - path: /opt/ha/backup_scheduler.py
                subPath: backup_scheduler.py
                readOnly: true
            wal-metrics:
              - path: /opt/ha/wal_metrics.py
                subPath: wal_metrics.py
                readOnly: true

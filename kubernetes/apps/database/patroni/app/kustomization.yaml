---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - externalsecret.yaml
  - pvc.yaml
  - registry-secret.yaml
  - helmrelease.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - referencegrant.yaml
configMapGenerator:
  - name: patroni-scripts
    files:
      - scripts/pg_rewind
      - scripts/backup_scheduler.py
      - scripts/wal_metrics.py
generatorOptions:
  disableNameSuffixHash: true

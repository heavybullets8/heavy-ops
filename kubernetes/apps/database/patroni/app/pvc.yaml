---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patroni
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs-16k
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: patroni-forensic
  namespace: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs-16k
  resources:
    requests:
      storage: 16Gi

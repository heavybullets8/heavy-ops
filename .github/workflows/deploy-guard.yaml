name: Deploy guard
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# NOTE: report-only. Findings are warning annotations; an app fails the job only once it is
# listed under `strict:` in .github/deploy-guard.yaml. The guard runs beside, not inside,
# the existing validation so its checks and failures are unchanged.
# NOTE: this repo is public and site-automation is private, so GitHub refuses a reusable-workflow
# call. The bot app mints a short-lived token that can only read site-automation, and the guard
# action runs from that checkout.
jobs:
  guard:
    # WARN: pull requests from forks get no secrets, so the guard runs only for branches in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a read-only token for site-automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: heavybullets8
          repositories: site-automation
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heavybullets8/site-automation
          ref: v1
          token: ${{ steps.app-token.outputs.token }}
          path: .site-automation
          persist-credentials: false
      - uses: ./.site-automation/.github/actions/deploy-guard
        with:
          paths: kubernetes/apps/business
          config: .github/deploy-guard.yaml

---
name: PostgreSQL Operations

on:
  pull_request:
    branches: [main]
    paths:
      - .tasks/postgres/**
      - .tasks/ops
      - kubernetes/apps/database/patroni/**
      - kubernetes/cloud/apps/database/patroni/**
      - .github/workflows/postgres-ops.yaml
  push:
    branches: [main]
    paths:
      - .tasks/postgres/**
      - .tasks/ops
      - kubernetes/apps/database/patroni/**
      - kubernetes/cloud/apps/database/patroni/**
      - .github/workflows/postgres-ops.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate coordinated deployment changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .tasks/postgres/validate.py "$BASE"
      - name: Check command and operational guards
        run: |
          bash -n .tasks/ops .tasks/postgres/postgres.sh
          python3 -m unittest discover -s .tasks/postgres/tests -p 'test_*.py'
          python3 .tasks/postgres/postgres.py --help
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .tasks/postgres/image
          load: true
          tags: postgres-patroni:check
          cache-from: type=gha,scope=postgres
      - name: Rehearse a major upgrade and interrupted operation
        run: python3 .tasks/postgres/tests/integration.py postgres-patroni:check

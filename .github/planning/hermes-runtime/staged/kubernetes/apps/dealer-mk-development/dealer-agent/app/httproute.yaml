---
apiVersion: "gateway.networking.k8s.io/v1"
kind: "HTTPRoute"
metadata:
  name: "dealer-agent"
spec:
  parentRefs:
    - name: "envoy-external"
      namespace: "network"
  hostnames:
    - "assistant-mk.development.example"
  rules:
    - matches:
        - path:
            type: "Exact"
            value: "/internal/ready"
        - path:
            type: "Exact"
            value: "/internal/wake"
        - path:
            type: "Exact"
            value: "/internal/control"
        - path:
            type: "Exact"
            value: "/internal/jobs"
        - path:
            type: "Exact"
            value: "/internal/notification-wake"
        - path:
            type: "Exact"
            value: "/internal/prompts"
        - path:
            type: "Exact"
            value: "/internal/connections"
        - path:
            type: "Exact"
            value: "/internal/native-browser"
        - path:
            type: "Exact"
            value: "/internal/native-browser/stream"
        - path:
            type: "Exact"
            value: "/internal/browser/viewer"
      backendRefs:
        - name: "dealer-agent"
          port: 8787

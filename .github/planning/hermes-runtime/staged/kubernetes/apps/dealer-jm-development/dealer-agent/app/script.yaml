apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "dealer-agent-worker-d0c8b0a3f195"
immutable: true
data:
  worker.py: |
    """Private per-attempt worker relay and read-only retained-history reader. No shell/exec API."""
    import hmac
    import http.server
    import json
    import os
    from pathlib import Path
    import re
    import signal
    import sqlite3
    import subprocess
    import tempfile
    import threading
    import urllib.error
    import urllib.request
    
    CONFIG = json.loads(Path('/runtime-config/config.json').read_text())
    UID = os.environ['DEALER_POD_UID']
    HOME = Path('/opt/data/home')
    READER = CONFIG['mode'] == 'reader'
    SLOTS = threading.BoundedSemaphore(16)
    UPSTREAM = CONFIG['controllerUrl']
    if not re.fullmatch(r'http://(?:[0-9]{1,3}\.){3}[0-9]{1,3}:8788', UPSTREAM):
        raise RuntimeError('Invalid private controller address')
    if not re.fullmatch(r'[A-Za-z0-9_-]{43}', CONFIG['operatorKey']):
        raise RuntimeError('Invalid private control credential')
    
    
    def page(after):
        if not re.fullmatch(r'[0-9]{1,20}', after):
            raise RuntimeError('Invalid history cursor')
        path = HOME / 'state.db'
        if not path.exists():
            return {'rows': [], 'hasMore': False}
        from hermes_state import SessionDB
        from agent.compaction_display import project_compaction_message_for_display
        database = SessionDB(path, read_only=True)
        try:
            rows, size = [], 0
            for session in database.get_compression_lineage(CONFIG['homeId']):
                offset = 0
                while True:
                    messages = database.get_messages(session, include_compacted=True, limit=128, offset=offset)
                    for message in messages:
                        if message['role'] not in ('user', 'assistant', 'tool'):
                            continue
                        identity = database._read_all('SELECT COALESCE((SELECT MIN(original.id) FROM messages original WHERE original.display_identity=current.display_identity AND original.session_id=current.session_id),current.id) FROM messages current WHERE current.id=?', (message['id'],))[0][0]
                        if identity <= int(after):
                            continue
                        projected = project_compaction_message_for_display(message)
                        if projected is None or projected.get('display_kind') == 'hidden':
                            continue
                        content = None if message['role'] == 'tool' else projected['content']
                        if content is not None and not isinstance(content, str):
                            content = json.dumps(content, ensure_ascii=False)
                        item = {'id': identity, 'role': 'assistant' if message.get('display_kind') in ('async_delegation_complete', 'runtime_notification') else message['role'], 'content': content}
                        if message.get('display_kind') == 'steer':
                            item['displayKind'] = 'steer'
                        length = len(json.dumps(item).encode())
                        if length > 1000000:
                            raise RuntimeError('Individual history row limit')
                        if len(rows) == 256 or size + length > 1000000:
                            return {'rows': rows, 'hasMore': True}
                        rows.append(item)
                        size += length + 2
                    if len(messages) < 128:
                        break
                    offset += len(messages)
            return {'rows': rows, 'hasMore': False}
        finally:
            database.close()
    
    
    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, *_):
            pass
    
        def refuse(self):
            self.send_response(503)
            self.send_header('Content-Length', '0')
            self.send_header('X-Dealer-Worker-Uid', UID)
            self.end_headers()
    
        def dispatch(self):
            if not SLOTS.acquire(blocking=False):
                self.refuse()
                return
            try:
                self.connection.settimeout(180)
                length = int(self.headers.get('Content-Length', '0'))
                if length < 0 or length > (30 * 1024 * 1024 if self.server.server_port == 9001 and self.path == '/v1/responses' else 2097152) or self.headers.get('Transfer-Encoding'):
                    raise RuntimeError('Request size limit')
                body = self.rfile.read(length) if length else None
                if self.server.server_port == 8788:
                    if self.headers.get('Authorization'):
                        raise RuntimeError('Unexpected forwarded authorization header')
                    if not hmac.compare_digest(self.headers.get('X-Dealer-Operator-Key', ''), CONFIG['operatorKey']) or self.headers.get('X-Dealer-Expected-Uid') != UID:
                        raise RuntimeError('Private control refused')
                    if not READER and self.path == '/skills/instructions' and self.command == 'POST':
                        env = {**os.environ, 'HERMES_HOME': str(HOME)}
                        result = subprocess.run(['/opt/hermes/.venv/bin/python', '-c', CONFIG['nativeSkillReader']], input=body, capture_output=True, env=env, timeout=30)
                        if result.returncode or len(result.stdout) > 1048576:
                            raise RuntimeError('Native skill collection failed')
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.send_header('Content-Length', str(len(result.stdout)))
                        self.send_header('X-Dealer-Worker-Uid', UID)
                        self.end_headers()
                        self.wfile.write(result.stdout)
                        return
                    if READER or self.path == '/transcript/page':
                        if self.path != '/transcript/page' or self.command != 'POST':
                            raise RuntimeError('Reader operation refused')
                        value = json.loads(body)
                        if set(value) != {'afterSourceRowId'}:
                            raise RuntimeError('Reader input refused')
                        data = json.dumps(page(value['afterSourceRowId'])).encode()
                        self.send_response(200)
                        self.send_header('Content-Type', 'application/json')
                        self.send_header('Content-Length', str(len(data)))
                        self.send_header('X-Dealer-Worker-Uid', UID)
                        self.end_headers()
                        self.wfile.write(data)
                        return
                    if not re.fullmatch(r'/(?:health(?:/detailed)?|v1/(?:capabilities|skills|toolsets)|v1/runs(?:/[A-Za-z0-9_-]+(?:/(?:events|stop|approval|steer|notifications|connections|requests(?:/srq-[A-Za-z0-9_-]+(?:/lock)?)?))?)?|api/sessions(?:/[A-Za-z0-9_-]+(?:/messages)?)?)(?:\?[A-Za-z0-9_=&-]*)?', self.path):
                        raise RuntimeError('Control path refused')
                    destination = 'http://127.0.0.1:8642' + self.path
                    headers = {'Authorization': 'Bearer ' + CONFIG['operatorKey']}
                    if self.headers.get('Idempotency-Key'):
                        headers['Idempotency-Key'] = self.headers['Idempotency-Key']
                else:
                    if READER or self.command != 'POST' or not hmac.compare_digest(self.headers.get('Authorization', ''), 'Bearer ' + CONFIG['proxyCredential']):
                        raise RuntimeError('Worker relay refused')
                    if self.server.server_port == 8686 and self.path == '/mcp':
                        destination = UPSTREAM + '/worker/mcp'
                    elif self.server.server_port == 8686 and self.path == '/jobs/manage':
                        destination = UPSTREAM + '/worker/jobs/manage'
                    elif self.server.server_port == 9001 and self.path == '/v1/responses':
                        destination = UPSTREAM + '/worker/v1/responses'
                    else:
                        raise RuntimeError('Worker path refused')
                    headers = {'Authorization': 'Bearer ' + CONFIG['proxyCredential']}
                headers['Content-Type'] = 'application/json'
                request = urllib.request.Request(destination, data=body, method=self.command, headers=headers)
                opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
                try:
                    response = opener.open(request, timeout=180)
                except urllib.error.HTTPError as error:
                    response = error
                with response:
                    self.send_response(response.status)
                    self.send_header('Content-Type', response.headers.get('Content-Type', 'application/json'))
                    self.send_header('X-Dealer-Worker-Uid', UID)
                    if response.headers.get('Retry-After'):
                        self.send_header('Retry-After', response.headers['Retry-After'])
                    self.send_header('Connection', 'close')
                    self.end_headers()
                    total = 0
                    while True:
                        data = response.read1(16384)
                        if not data:
                            break
                        total += len(data)
                        if total > 16777216 and not self.path.endswith('/events'):
                            raise RuntimeError('Response limit')
                        self.wfile.write(data)
                        self.wfile.flush()
                self.close_connection = True
            except Exception:
                self.close_connection = True
                try:
                    self.refuse()
                except Exception:
                    pass
            finally:
                SLOTS.release()
    
        do_GET = dispatch
        do_POST = dispatch
    
    
    class NoRedirect(urllib.request.HTTPRedirectHandler):
        def redirect_request(self, *_):
            raise RuntimeError('Redirect refused')
    
    
    servers = []
    for host, port in [('0.0.0.0', 8788)] + ([] if READER else [('127.0.0.1', 8686), ('127.0.0.1', 9001)]):
        server = http.server.ThreadingHTTPServer((host, port), Handler)
        server.daemon_threads = True
        server.request_queue_size = 16
        servers.append(server)
        threading.Thread(target=server.serve_forever, daemon=True).start()
    
    process = None
    dashboard = None
    if not READER:
        if any(CONFIG.get(key) for key in ('nativeBrowser', 'nativeApiApprovalBridge', 'nativeUserPromptBridge', 'nativeJobs', 'nativeProcessWake', 'nativeApiConnectionsBridge')):
            capabilities = json.loads(Path('/opt/dealer/runtime-capabilities.json').read_text())
            if capabilities.get('sourceRevision') != 'f97608f178d1ffeca59860195ab7da295f7c8e5f':
                raise RuntimeError('Native image source capability mismatch')
            if capabilities.get('activityLifetime') != 'native-activity-v1':
                raise RuntimeError('Native process and desktop lifetime capability is unavailable')
            if CONFIG.get('nativeBrowser') and capabilities.get('browser') != 'structured-bot-screen':
                raise RuntimeError('Native browser capability is unavailable')
            if CONFIG.get('nativeApiApprovalBridge') and capabilities.get('apiApprovalBridge') != 'session-callback-v1':
                raise RuntimeError('Native exact approval capability is unavailable')
            if CONFIG.get('nativeUserPromptBridge') and capabilities.get('userPromptBridge') != 'native-server-requests-v1':
                raise RuntimeError('Native user prompt capability is unavailable')
            if CONFIG.get('nativeJobs') and capabilities.get('jobsProvider') != 'dealer-native-cron-v1':
                raise RuntimeError('Native Jobs provider capability is unavailable')
            if CONFIG.get('nativeProcessWake') and capabilities.get('processWakeBridge') != 'native-durable-wake-v1':
                raise RuntimeError('Native durable process wake capability is unavailable')
            if CONFIG.get('nativeApiConnectionsBridge') and (capabilities.get('connectionsBridge') != 'native-connection-card-v1' or not CONFIG.get('nativeUserPromptBridge')):
                raise RuntimeError('Native connections callback capability is unavailable')
        if CONFIG.get('nativeWeb') and 'web' not in CONFIG['hermes']['platform_toolsets']['api_server']:
            raise RuntimeError('Native Web configuration mismatch')
        # Files are created by the same non-root worker UID; an absent ownership repair stays fatal.
        if HOME.is_symlink():
            raise RuntimeError('Home symlink refused')
        HOME.mkdir(exist_ok=True, mode=0o700)
        HOME.chmod(0o700)
        for name, content, mode in [('config.yaml', json.dumps(CONFIG['hermes']), 0o600), ('SOUL.md', CONFIG['soul'], 0o400)]:
            target = HOME / name
            if target.is_symlink():
                raise RuntimeError('Managed identity symlink refused')
            with tempfile.NamedTemporaryFile(dir=HOME, prefix='.prepared-', delete=False) as prepared:
                temporary = Path(prepared.name)
                prepared.write(content.encode())
                prepared.flush()
                os.fsync(prepared.fileno())
            try:
                temporary.chmod(mode)
                temporary.replace(target)
            finally:
                temporary.unlink(missing_ok=True)
        path = HOME / 'state.db'
        marker = HOME / ('.prompt-refreshed-' + CONFIG['workerIdentity'])
        if CONFIG['refreshPrompt'] and not marker.exists() and path.exists():
            connection = sqlite3.connect(str(path), timeout=5)
            try:
                connection.execute('BEGIN IMMEDIATE')
                connection.execute('UPDATE sessions SET system_prompt=NULL,system_prompt_hash=NULL WHERE id=?', (CONFIG['homeId'],))
                connection.commit()
            finally:
                connection.close()
        if CONFIG['refreshPrompt'] and not marker.exists():
            marker.write_text(CONFIG['homeId'])
            marker.chmod(0o600)
        environment = {'PATH': '/opt/hermes/.venv/bin:/usr/local/bin:/usr/bin:/bin', 'HOME': str(HOME), 'HERMES_HOME': str(HOME), 'HERMES_SHARED_AUTH_DIR': str(HOME / 'shared-auth'), 'PYTHONDONTWRITEBYTECODE': '1'}
        if CONFIG.get('nativeBrowser'):
            environment.update({'AGENT_BROWSER_EXECUTABLE_PATH': '/usr/local/bin/dealer-native-chromium', 'AGENT_BROWSER_ARGS': '--disable-dev-shm-usage', 'AGENT_BROWSER_PROFILE': str(HOME / 'browser-profile')})
            dashboard = subprocess.Popen(['/opt/hermes/.venv/bin/python', '-B', '/opt/dealer/native-browser-dashboard.py', '--host', '0.0.0.0', '--port', '8643'], env={**environment, 'HERMES_DASHBOARD_SESSION_TOKEN': CONFIG['operatorKey']})
        process = subprocess.Popen(['/opt/hermes/.venv/bin/hermes', 'gateway', 'run', '--no-supervise', '--external-supervisor'], env=environment)
    
    stopped = threading.Event()
    
    
    def stop(*_):
        if process and process.poll() is None:
            process.terminate()
        if dashboard and dashboard.poll() is None:
            dashboard.terminate()
        stopped.set()
    
    
    signal.signal(signal.SIGTERM, stop)
    signal.signal(signal.SIGINT, stop)
    while not stopped.wait(0.1):
        if process and process.poll() is not None:
            break
    if process:
        try:
            process.wait(timeout=20)
        except subprocess.TimeoutExpired:
            process.kill()
            process.wait(timeout=5)
    if dashboard:
        if dashboard.poll() is None:
            dashboard.terminate()
        try:
            dashboard.wait(timeout=5)
        except subprocess.TimeoutExpired:
            dashboard.kill(); dashboard.wait(timeout=5)
    for server in servers:
        server.shutdown()

# Standalone final-switch projection; no management capability; ADMIN/outreach encryption and every other field retained.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bighorn-byte-outreach-secret
  namespace: business
spec:
  target:
    name: bighorn-byte-outreach-secret
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ADMIN_DATABASE_URL: '{{ index . "ADMIN_DATABASE_URL" | default "" }}'
        ADMIN_DIRECT_URL: '{{ index . "ADMIN_DIRECT_URL" | default "" }}'
        ADMIN_ENCRYPTION_KEYS: '{{ index . "ADMIN_ENCRYPTION_KEYS" | default "" }}'
        ADMIN_ENCRYPTION_KEY_ID: '{{ index . "ADMIN_ENCRYPTION_KEY_ID" | default "" }}'
        ADMIN_LOOKUP_KEY: '{{ index . "ADMIN_LOOKUP_KEY" | default "" }}'
        BHB_CRON_ENABLED: '{{ index . "BHB_CRON_ENABLED" | default "" }}'
        BHB_ENVIRONMENT: '{{ index . "BHB_ENVIRONMENT" | default "" }}'
        BHB_MAINTENANCE_MODE: '{{ index . "BHB_MAINTENANCE_MODE" | default "" }}'
        BHB_PUBLIC_ORIGIN: '{{ index . "BHB_PUBLIC_ORIGIN" | default "" }}'
        BROWSER_WS_PATH: '{{ index . "BROWSER_WS_PATH" | default "" }}'
        CLOUDFLARE_ACCOUNT_ID: '{{ index . "CLOUDFLARE_ACCOUNT_ID" | default "" }}'
        CLOUDFLARE_EMAIL_API_TOKEN: '{{ index . "CLOUDFLARE_EMAIL_API_TOKEN" | default "" }}'
        DATABASE_URL: '{{ index . "DATABASE_URL" | default "" }}'
        DEEPSEEK_API_KEY: '{{ index . "DEEPSEEK_API_KEY" | default "" }}'
        DIRECT_URL: '{{ index . "DIRECT_URL" | default "" }}'
        GSC_CREDENTIALS_JSON: '{{ index . "GSC_CREDENTIALS_JSON" | default "" }}'
        GSC_PROPERTY: '{{ index . "GSC_PROPERTY" | default "" }}'
        OUTREACH_ARTIFACT_BUCKET: '{{ index . "OUTREACH_ARTIFACT_BUCKET" | default "" }}'
        OUTREACH_BROWSER_INTERNAL_ORIGIN: '{{ index . "OUTREACH_BROWSER_INTERNAL_ORIGIN" | default "" }}'
        OUTREACH_BROWSER_PROVIDER: '{{ index . "OUTREACH_BROWSER_PROVIDER" | default "" }}'
        OUTREACH_BROWSER_URL: '{{ index . "OUTREACH_BROWSER_URL" | default "" }}'
        OUTREACH_BUSINESS_MAILING_ADDRESS: '{{ index . "OUTREACH_BUSINESS_MAILING_ADDRESS" | default "" }}'
        OUTREACH_ENABLED: '{{ index . "OUTREACH_ENABLED" | default "" }}'
        OUTREACH_ENVIRONMENT: '{{ index . "OUTREACH_ENVIRONMENT" | default "" }}'
        OUTREACH_GEOAPIFY_BROWSER_KEY: '{{ index . "OUTREACH_GEOAPIFY_BROWSER_KEY" | default "" }}'
        OUTREACH_GEOAPIFY_KEY: '{{ index . "OUTREACH_GEOAPIFY_KEY" | default "" }}'
        OUTREACH_MAIL_CAPTURE_ADDRESS: '{{ index . "OUTREACH_MAIL_CAPTURE_ADDRESS" | default "" }}'
        OUTREACH_MAIL_CAPTURE_TOKEN: '{{ index . "OUTREACH_MAIL_CAPTURE_TOKEN" | default "" }}'
        OUTREACH_OUR_ADDRESSES: '{{ index . "OUTREACH_OUR_ADDRESSES" | default "" }}'
        OUTREACH_PAGESPEED_KEY: '{{ index . "OUTREACH_PAGESPEED_KEY" | default "" }}'
        OUTREACH_PROXY_URL: '{{ index . "OUTREACH_PROXY_URL" | default "" }}'
        OUTREACH_PUSHOVER_API_TOKEN: '{{ index . "OUTREACH_PUSHOVER_API_TOKEN" | default "" }}'
        OUTREACH_PUSHOVER_USER_KEY: '{{ index . "OUTREACH_PUSHOVER_USER_KEY" | default "" }}'
        OUTREACH_QUO_API_KEY: '{{ index . "OUTREACH_QUO_API_KEY" | default "" }}'
        OUTREACH_SEARCH_ENGINE: '{{ index . "OUTREACH_SEARCH_ENGINE" | default "" }}'
        R2_ACCESS_KEY_ID: '{{ index . "R2_ACCESS_KEY_ID" | default "" }}'
        R2_ACCOUNT_ID: '{{ index . "R2_ACCOUNT_ID" | default "" }}'
        R2_BUCKET_NAME: '{{ index . "R2_BUCKET_NAME" | default "" }}'
        R2_PUBLIC_URL: '{{ index . "R2_PUBLIC_URL" | default "" }}'
        R2_SECRET_ACCESS_KEY: '{{ index . "R2_SECRET_ACCESS_KEY" | default "" }}'
        REPORT_EMAILS: '{{ index . "REPORT_EMAILS" | default "" }}'
        TURNSTILE_SECRET_KEY: '{{ index . "TURNSTILE_SECRET_KEY" | default "" }}'
        TURNSTILE_SITE_KEY: '{{ index . "TURNSTILE_SITE_KEY" | default "" }}'
        notesPlain: '{{ index . "notesPlain" | default "" }}'

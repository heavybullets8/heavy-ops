# Apply only for the isolation check, then delete. These labels grant precisely
# the same egress as the trial app pods without joining either app Service.
apiVersion: v1
kind: Pod
metadata:
  name: network-probe
  namespace: mkjm-hosting-trial
  labels:
    app.kubernetes.io/name: mkjm-trial-app
    app.kubernetes.io/instance: network-probe
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox:1.36.1
      command: [sh, -c, 'sleep 3600']
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mkjm-hosting-trial
  labels:
    app.kubernetes.io/part-of: mkjm-hosting-trial
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: openebs-zfs-16k
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mkjm-hosting-trial
  labels:
    app.kubernetes.io/part-of: mkjm-hosting-trial
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mkjm-trial-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mkjm-trial-postgres
        app.kubernetes.io/part-of: mkjm-hosting-trial
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.23
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: mkjm_hosting_trial
            - name: POSTGRES_USER
              value: mkjm_trial
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trial-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mkjm-hosting-trial
  labels:
    app.kubernetes.io/part-of: mkjm-hosting-trial
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mkjm-trial-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 300

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.20.2
    values: [../kubernetes/cilium/helm-values.yaml]
  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.61.0
    values: [../kubernetes/flux-operator/helm-values.yaml]
    needs: [kube-system/cilium]
  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.61.0
    values: [../kubernetes/flux-instance/helm-values.yaml]
    needs: [flux-system/flux-operator]
